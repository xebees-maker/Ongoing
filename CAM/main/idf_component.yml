## XCLK 24MHz/fb_count=1 설정이었던 것으로 확인됨. 이제 이 값(20MHz/2)을 콘솔 기반
## shot/ls/get 파이프라인에 적용해 검증 — project_cam_dvp_corruption_investigation 메모리 참고.

