<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영농일지 뼈대 시안</title>
<style>
  :root { --bg:#e5e7eb; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:rgba(127,127,127,.18);
          --acc:#2563eb; --warn:#d97706; --bad:#dc2626; --ok:#16a34a; --chip:#f3f4f6; --frame:#cbd5e1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#1b1e24; --text:#e5e7eb; --muted:#9ca3af; --chip:#262a33; --frame:#374151; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, system-ui, "Malgun Gothic", sans-serif; background:var(--frame); color:var(--text); }
  .dev { max-width:420px; margin:0 auto; padding:10px 16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px; }
  .dev button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  .dev .depth { margin-left:auto; font-weight:600; }
  .phone { max-width:420px; margin:0 auto 24px; min-height:760px; background:var(--bg); position:relative; overflow:hidden; border-radius:14px; }
  .scr { position:absolute; inset:0; overflow-y:auto; background:var(--bg); }
  .bar { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:12px 14px; background:var(--card); border-bottom:1px solid var(--line); }
  .bar h1 { font-size:17px; margin:0; flex:1; }
  .bar .b { font-size:20px; cursor:pointer; padding:0 6px; color:var(--acc); background:none; border:0; }
  .dbadge { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:1px 7px; }
  .body { padding:12px; display:flex; flex-direction:column; gap:10px; }
  section { background:var(--card); border-radius:10px; padding:10px 12px; }
  section h2 { font-size:15px; margin:0 0 6px; display:flex; align-items:center; gap:6px; }
  section h3 { font-size:14px; margin:10px 0 2px; }
  .muted { color:var(--muted); font-size:13px; }
  .ph { color:var(--muted); font-size:13px; border:1px dashed var(--line); border-radius:8px; padding:14px; text-align:center; }
  .row { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row .t { flex:1; min-width:0; }
  .row .s { font-size:12px; color:var(--muted); }
  .tap { cursor:pointer; }
  .chev { color:var(--muted); }
  .must { font-size:11px; color:var(--bad); border:1px solid var(--bad); border-radius:4px; padding:0 4px; margin-left:4px; }
  .late { color:var(--bad); }
  .chk { width:22px; height:22px; border:2px solid var(--muted); border-radius:6px; flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .chk.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  .done .t { text-decoration:line-through; color:var(--muted); }
  .btn { font:inherit; padding:11px 14px; border-radius:9px; border:0; background:var(--acc); color:#fff; cursor:pointer; width:100%; }
  .btn.sec { background:var(--chip); color:var(--text); }
  .btns { display:flex; gap:8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:6px 11px; border-radius:16px; background:var(--chip); cursor:pointer; font-size:14px; border:1px solid transparent; }
  .chip.on { border-color:var(--acc); color:var(--acc); font-weight:600; }
  .chip.dis { opacity:.45; cursor:default; }
  label.f { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
  input, select { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid rgba(127,127,127,.4); background:var(--card); color:var(--text); }
  input.w { width:100%; }
  input.n { width:80px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .stepper { display:flex; align-items:center; gap:10px; }
  .stepper button { width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--chip); color:var(--text); font-size:18px; cursor:pointer; }
  .steps { display:flex; gap:4px; padding:8px 12px 0; }
  .steps i { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .steps i.on { background:var(--acc); }
  .note { font-size:13px; padding:8px 10px; border-radius:8px; background:var(--chip); margin-top:6px; }
  .note.warn { border-left:3px solid var(--warn); }
  .note.bad { border-left:3px solid var(--bad); }
  .note.ok { border-left:3px solid var(--ok); }
  .why { font-size:12px; color:var(--muted); margin-top:4px; }
  details.src { font-size:12px; margin-top:4px; }
  details.src summary { color:var(--acc); cursor:pointer; }
  details.src .srow { padding:4px 0 4px 8px; border-left:2px solid var(--chip); margin-top:4px; }
  details.src a { color:inherit; }
  .week { display:flex; gap:4px; }
  .day { flex:1; text-align:center; padding:6px 0; border-radius:8px; background:var(--chip); cursor:pointer; font-size:12px; }
  .day b { display:block; font-size:15px; }
  .day .dots { height:8px; margin-top:3px; display:flex; justify-content:center; gap:2px; }
  .day .dots span { width:6px; height:6px; border-radius:3px; background:var(--acc); }
  .day.free { outline:2px solid var(--ok); }
  .day.today { background:var(--acc); color:#fff; }
  .day.today .dots span { background:#fff; }
  .hhead { display:flex; align-items:center; gap:8px; cursor:pointer; }
  .hhead .n { font-weight:700; }
  .stage { font-size:13px; color:var(--muted); flex:1; }
  .card0 { cursor:pointer; }
  .big { font-size:28px; font-weight:700; }
  .modal { position:absolute; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:5; }
  .mbox { background:var(--card); width:100%; border-radius:14px 14px 0 0; max-height:88%; overflow-y:auto; }
  .tl .row .t b { font-weight:600; }
  .tag { font-size:11px; padding:1px 6px; border-radius:4px; background:var(--chip); color:var(--muted); }
  .tag.act { background:var(--ok); color:#fff; } .tag.fix { background:var(--acc); color:#fff; }
  .scope .chip { flex:1; text-align:center; }
  .calc { font-size:13px; margin-top:6px; }
  .calc b { font-size:15px; }
  .circ { display:flex; align-items:center; gap:6px; padding:4px 0; font-size:13px; }
  .circ span.l { flex:1; }
</style>
</head>
<body>
<div class="dev">
  <button id="devReset">처음 설치부터</button>
  <button id="devDone">설치 끝난 상태로</button>
  <span class="depth" id="devDepth">깊이 0</span>
</div>
<div class="phone" id="phone"></div>

<script>
/* 영농일지 화면 뼈대 시안(2026-11-27, 11-28 개정, 11-28 오후 개정: 최초 노드 = 농장, 여러 작물, 신령버섯, 패시브, 순환팬 단계별).
   기능 없음: 화면, 이동, 기본값이 채워진 모습만.
   설계: Docs/설계_영농일지_2026-11-26.md, 문제 ID 출처: Docs/FMEA_양송이_2026-11-27.md(신령버섯은 14장 S1-S9)
   깊이: 주화면 0, 열고 들어가 닫고 나와야 하는 화면이나 창마다 +1. 마법사 단계는 옆으로 이동(같은 깊이).
   농장 설정 마법사는 처음 설치(깊이 1)와 설정에서 다시 열기(깊이 2)에 같은 화면을 쓴다.
   계층: 농장 → 시설 → 설비 → 키우는 작물 → 작기(재배사 + 작물) → 배지, 재배법, 단계. */

/* ---------- 농장 쪽 상수(작물과 무관) ---------- */
var STD_KGM2 = 58.5;     // 표준 두께(약 15cm)의 1㎡당 kg — 사용자 재배사: 18m, 10톤, 7단
var THIN_KGM2 = 45;      // 이보다 적으면 배지량 부족 경고(제주 자료 평당 150kg)
var THICK_KGM2 = 60;     // 이보다 많으면 두꺼움 → 1-3주기 예상 수량을 높임(4주기 안내는 하지 않음)
var HEAT_PEAK = 1.65;    // 균사 생장 중 배지 1톤당 최대 발열 kW(접종 뒤 9일 무렵)
var HEAT_VENT = 0.1;     // 1톤당 환기 부하 kW
var INSUL = { panel:{ name:'판넬 10cm', u:0.37, leak:1 }, urethane:{ name:'판넬 + 우레탄 코팅', u:0.22, leak:1 },
              passive:{ name:'패시브(고단열·기밀·열회수)', u:0.12, leak:0, hrv:0.75 } };   // 패시브 값은 패시브 하우스 기준을 옮긴 추정
var MAT = { rice:'볏짚', wheat:'밀짚', mix:'볏짚·밀짚 혼용', cotton:'폐면 포함' };
var STATE = { 1:'1차 배지(후발효 전)', 2:'2차 배지(후발효 끝)', 3:'3차 배지(접종 끝)' };
var CIRC_STAGES = ['후발효', '균사 생장', '복토 뒤', '발이', '생육'];

/* ---------- 기본값의 근거(논문, 공공기관 자료만. 업체 자료, 위키는 넣지 않음) ---------- */
var SRC = {
  rda:     { who:'농촌진흥청', kind:'기관', title:'품목별 농업소득 향상 운영 매뉴얼: 양송이(2011)', url:'https://www.nongsaro.go.kr/cms_contents/937/100218_MF_ATTACH_01.pdf' },
  rdaTech: { who:'농촌진흥청 농업과학기술원', kind:'기관', title:'양송이 재배기술', url:'https://agri.jeju.go.kr/files/board/%EC%96%91%EC%86%A1%EC%9D%B4%20%EC%9E%AC%EB%B0%B0%20%EA%B8%B0%EC%88%A0.pdf' },
  nongsaro:{ who:'농사로(농촌진흥청)', kind:'기관', title:'양송이 퇴비 영상', url:'http://www.nongsaro.go.kr/portal/ps/psb/psby/vodPlay.ps?mvpNo=1571&mvpClipNo=&menuId=PS65512' },
  uc:      { who:'UC ANR(캘리포니아대)', kind:'기관', title:'Commercial Production of Button Mushrooms in California', url:'https://ucanr.edu/sites/default/files/2017-02/256745.pdf' },
  kms1981: { who:'한국균학회지', kind:'논문', title:'후발효 터널 연구(1981)', url:'https://koreascience.or.kr/article/JAKO198103040053632.do' },
  zied18:  { who:'Zied 외, Frontiers in Sustainable Food Systems', kind:'논문', title:'Using of Appropriated Strains in the Practice of Compost Supplementation for A. subrufescens Production(2018)', url:'https://www.frontiersin.org/journals/sustainable-food-systems/articles/10.3389/fsufs.2018.00026/full' },
  zied17:  { who:'Zied 외, BioMed Research International', kind:'논문', title:'Mycochemical Characterization of A. subrufescens(2017)', url:'https://pmc.ncbi.nlm.nih.gov/articles/PMC5610804/' },
  pardo20: { who:'Pardo-Giménez 외, Scientific Reports', kind:'논문', title:'Optimization of cultivation techniques improves the agronomic behavior of A. subrufescens(2020)', url:'https://www.nature.com/articles/s41598-020-65081-2' },
  kaku26:  { who:'Kakumyan 외, Studies in Fungi', kind:'논문', title:'Enzymatic dynamics during cultivation cycle of A. subrufescens on commercial compost(2026)', url:'https://www.maxapress.com/article/doi/10.48130/sif-0026-0012' }
};

/* ---------- 작물 템플릿 ---------- */
/* rows: [항목, 기본값, 근거 목록[[SRC 키, 그 자료가 말하는 값]]]. 근거가 없는 값은 현장 경험 값 */
var CROPS = {
  mushroom: { name:'양송이', obj:'를', std:58.5, thin:45, thick:60, store:'1-2°C', dry:false,
    rows:[ ['단계', '입상 → 후발효 → 접종 → 복토 → 후토 → 1·2·3주기 → 폐상', [['rda', '재배 순서'], ['rdaTech', '재배 순서']]],
           ['후발효', '58-62°C 5일 → 3일에 40°C → 접종 전 25°C · 68°C 절대 한계',
             [['rda', '정열 60°C 6-8시간 → 55-58°C 1-2일 → 50-55°C 2-3일 → 48-50°C 1-2일 → 45°C 내외 종료'], ['kms1981', '배지와 공기 온도 차 2°C 이내'], ['uc', '종료: 암모니아 냄새 없음, 10 ppm 미만']]],
           ['발이 전', '배지 23-25°C · 습도 90-95% · CO2 1,500-3,000 ppm(환기 최소)',
             [['uc', '배지 27°C를 넘으면 피해'], ['rdaTech', '균사 생장 온도, 습도'], ['rda', '접종 뒤 23°C 이하(괴균병 예방)']]],
           ['발이 뒤', '관수 안 함(갓 변형) · 습도 80%대 · 16-18°C · CO2 1,000 ppm 이하',
             [['uc', 'CO2 0.08% 이하'], ['rda', '시간당 3-4회 이상 환기, 습도 80% 이하(갈반병 방지)'], ['rdaTech', '1주기 16-17°C, 2-3주기 15-16°C']]],
           ['관수', '복토 후, 후토 후, 각 주기 시작에 하루 600 L씩 3일(60평 기준)'],
           ['배지와 저장', '약 15cm(1㎡당 58.5 kg) · 생물 저장 1-2°C',
             [['rdaTech', '평당 150 kg'], ['nongsaro', '1㎡당 50-60 kg'], ['rda', '수확 직후 4°C 이하 예냉']]],
           ['할 일', '31가지 + 예방 할 일 32가지'] ] },
  sinryeong: { name:'신령버섯', obj:'을', std:78, thin:60, thick:85, store:'5-10°C', dry:true,
    rows:[ ['단계', '양송이와 같은 순서: 입상 → 후발효 → 접종 → 균사 생장(약 20일) → 복토 → 발이 → 1·2·3주기 → 폐상'],
           ['발이 전', '양송이와 거의 같음 · 배지 23-26°C 변온(하루에도 여러 번) · CO2 1,500-3,000 ppm(양송이와 같음)',
             [['zied18', '균사 생장 26°C, 습도 80%, CO2 3,000 ppm'], ['zied17', '균사 생장 28°C, 습도 95%, 외부 환기 없이 20일'], ['pardo20', '복토 뒤 7일 배지 28°C']]],
           ['발이 뒤', '관수함 · 습도 90% 이상 · 배지 23-26°C 그대로 · CO2 1,000 ppm 이하(양송이와 같음)',
             [['kaku26', '발이 22-25°C, 습도 95-97%, CO2 1,500 mg/㎥(약 800 ppm) 아래'], ['zied17', '발이 유도 CO2 800 ppm 미만(19°C, 빛 150 lux)'], ['pardo20', '수확 중 배지 26°C, CO2 700 ppm']]],
           ['관수', '양송이와 같은 600 L × 3일 + 그 사이 배지 상태 보고 하루 1-2회 300 L(선택) → 건조 환기(기본 6시간)'],
           ['배지와 저장', '양송이와 같은 배지를 약 20cm로(1㎡당 약 78 kg) · 생물 저장 5-10°C'],
           ['손질과 건조', '다듬기 → 세척 → 물기 빼기 10분 → (썰기) → 40°C에서 1시간에 1°C씩 45°C → 45°C 유지(통째 40시간, 반 약 20시간, 슬라이스 약 8시간) → 포장할 때만 60°C 2-3시간'],
           ['할 일', '양송이 할 일 + 배지 상태 확인, 건조 환기, 손질, 건조기'] ],
    note:'20°C 아래면 죽기보다 자라지 않습니다. 매일 관수는 하지 않는 농가도 있어 선택 항목입니다. 외국 연구는 배지를 26-28°C로 운영하기도 합니다(참고).' }
};
/* 형태별 건조 시간: 45°C 유지만 줄어듦(사용자: 반으로 자르면 절반, 슬라이스는 1/5). 올리는 5시간은 같음 */
var DRY_FORMS = { whole:{ name:'통째(원형 보존)', hold:40 }, half:{ name:'반으로 자름', hold:20 }, slice:{ name:'슬라이스(티백, 추출물)', hold:8 } };
function dryHours(f) { return 5 + DRY_FORMS[f].hold; }
function srcBlock(list) {
  if (!list || !list.length) return '';
  return '<details class="src"><summary>근거 ' + list.length + '</summary>' + list.map(function (x) {
    var s = SRC[x[0]];
    return '<div class="srow"><span class="tag">' + s.kind + '</span> <b>' + s.who + '</b>: ' + x[1] +
      '<div class="muted">' + s.title + ' · <a href="' + s.url + '" target="_blank" rel="noopener">원문</a></div></div>';
  }).join('') + '</details>';
}
var CROP_ORDER = ['mushroom', 'sinryeong'];
function cropDefaults() {
  var circ = {}; CIRC_STAGES.forEach(function (s) { circ[s] = s !== '후발효'; });
  return { mat:'rice', state:1, circ:circ };
}

var S;            // 상태
var stack = [];   // 화면 쌓기: {id, arg}
function fresh() {
  return { installed:false, step:1, mode:'new',
    farmName:'', loc:null,
    houses:3, nameStyle:'num', names:[],
    bld:{ floor:50, height:4.5, insul:'panel', doors:2, facing:'모름' },
    bed:{ rows:2, tiers:4, gap:0.6, width:1.35, length:18 },
    shared:{ storage:false, fridge:true, warehouse:true, dryer:false }, dryerN:1, dryerKg:100, dform:'whole',
    fridges:[ { crop:'mushroom', setC:2 } ],
    equip:{ boiler:'move', boilerN:1, ac:true, acCool:23, acHeat:20, humid:true,
            supply:true, supplyN:1, roofVent:'passive', circ:true, circN:2, steam:true, hrv:true, hrvBypass:true },
    crops:['mushroom'], byCrop:{ mushroom:cropDefaults(), sinryeong:cropDefaults() },
    remove:{},               // 마법사에서 동 수를 줄일 때: 줄이는 재배사와 처리
    cycles:[], done:{}, saved:null };
}
function namesFor(style, n) {
  var a = [];
  for (var i = 0; i < n; i++) {
    if (style === 'num') a.push((i + 1) + '동');
    else if (style === 'abc') a.push(String.fromCharCode(65 + i) + '동');
    else if (style === 'kor') a.push('가나다라마바사아자차'.charAt(i) + '동');
    else a.push(S.names[i] || ('재배사 ' + (i + 1)));
  }
  return a;
}
function demoInstalled() {
  S = fresh(); S.installed = true; S.names = namesFor('num', 3); S.farmName = '우리 농장';
  S.crops = ['mushroom', 'sinryeong'];
  S.cycles = [
    { h:0, crop:'mushroom', stage:'복토', day:5, media:1, mat:'rice', ton:10, filled:7, next:'후토 2일 뒤' },
    { h:1, crop:'mushroom', stage:'후발효', day:3, media:1, mat:'wheat', ton:10, filled:7, next:'접종 6일 뒤(예정)' },
    { h:2, crop:'sinryeong', stage:'2주기 수확', day:9, media:1, mat:'rice', ton:5, filled:4, next:'3주기 약 12일 뒤' } ];
}

/* ---------- 계산 ---------- */
function tierArea() { return S.bed.width * S.bed.length; }                       // 한 단 ㎡
function bedTiers() { return S.bed.rows * S.bed.tiers; }                         // 재배사 전체 단 수
function growArea() { return tierArea() * bedTiers(); }                          // 재배 면적 ㎡
function pyeong(m2) { return Math.round(m2 / 3.3058); }
function tiersFor(ton, crop) { return ton * 1000 / (tierArea() * (crop ? CROPS[crop].std : STD_KGM2)); }   // 그 작물의 표준 두께로 채울 수 있는 단
function isPassive() { return S.bld.insul === 'passive'; }
function envLoad(dT) {                                                           // 바깥과 dT°C 차이일 때 외피와 문틈 kW(첫 작기 기본값)
  dT = dT || 10;
  var ins = INSUL[S.bld.insul];
  var floorM2 = S.bld.floor * 3.3058, len = S.bed.length + 2, wid = floorM2 / len;
  var arch = Math.PI * wid / 2 * len, walls = 2 * len * S.bld.height * 0.6 + 2 * wid * S.bld.height;
  var cond = ins.u * (arch + walls) * dT / 1000;
  var gapM2 = S.bld.doors * 0.062, q = 0.6 * gapM2 * Math.sqrt(2 * 3 / 1.2);    // m3/s, 압력 차 3Pa
  var leak = q * 1.2 * 1.005 * dT * ins.leak;                                    // kW(패시브는 거의 0)
  return cond + leak;
}
function ventFactor() { return isPassive() && S.equip.hrv ? 1 - INSUL.passive.hrv : 1; }
function heatNeed(ton) { return ton * (HEAT_PEAK + HEAT_VENT * ventFactor()) + envLoad(10); }
function f1(x) { return (Math.round(x * 10) / 10).toFixed(1); }

/* 작기 시작의 배지 블록: (작물) → 총 무게 → 몇 단 분량, 채운 단 수 → 경고 */
function mediaBlock(c, idx) {
  var cap = tiersFor(c.ton, c.crop), kgm2 = c.ton * 1000 / (tierArea() * c.filled), cd = S.byCrop[c.crop], cr = CROPS[c.crop];
  var out = '';
  if (S.crops.length > 1) out += '<label class="f">작물</label><div class="chips">' +
    S.crops.map(function (k) { return '<span class="chip ' + (c.crop === k ? 'on' : '') + '" data-cm="' + idx + '" data-k="crop" data-v="' + k + '">' + CROPS[k].name + '</span>'; }).join('') + '</div>' +
    '<div class="why">작물을 바꾸면 배지 기본값, 재배법, 단계 날짜가 그 작물 것으로 바뀝니다.</div>';
  out += '<label class="f">배지 재료</label><div class="chips">' +
    Object.keys(MAT).map(function (k) { return '<span class="chip ' + (c.mat === k ? 'on' : '') + '" data-cm="' + idx + '" data-k="mat" data-v="' + k + '">' + MAT[k] + '</span>'; }).join('') + '</div>' +
    '<div class="why">기본값은 농장 설정의 ' + CROPS[c.crop].name + ' "주로 쓰는 배지"(' + MAT[cd.mat] + ')입니다. 재료에 따라 후발효부터 1주기까지의 관리 값이 조금씩 달라집니다.</div>' +
    '<label class="f">입상하는 배지 총 무게</label><div class="stepper"><button data-act="tonm" data-i="' + idx + '">−</button><b>' + c.ton + '톤</b><button data-act="tonp" data-i="' + idx + '">+</button>' +
    '<span class="muted">→ 약 <b>' + f1(cap) + '단</b> 분량</span></div>' +
    '<label class="f">채우는 단 수(설비 ' + bedTiers() + '단)</label><div class="stepper"><button data-act="film" data-i="' + idx + '">−</button><b>' + c.filled + '단</b><button data-act="filp" data-i="' + idx + '">+</button></div>';
  if (kgm2 < cr.thin) out += '<div class="note bad">' + c.filled + '단을 채우면 배지가 얇습니다. ' + Math.max(1, Math.floor(cap)) + '단 정도가 맞습니다' + (c.crop === 'sinryeong' ? '(신령버섯은 약 20cm 권고)' : '') + '.</div>';
  else if (kgm2 > cr.thick) out += '<div class="note ok">배지가 두꺼워 1-3주기 예상 수량을 그만큼 높게 잡습니다.</div>';
  var need = heatNeed(c.ton), fm = c.crop === 'sinryeong' ? 'S8 배지 얇음, A7 공조 용량 부족' : 'A3 배지량 부족, A7 공조 용량 부족';
  if (S.equip.ac && need > S.equip.acCool) out += '<div class="note warn">이 배지량은 공조 냉방(' + S.equip.acCool + ' kW)에 비해 많아 균사 생장 9일 무렵 배지 온도가 오를 수 있습니다(필요 약 ' + Math.round(need) + ' kW). 예보를 보고 그 기간 냉방과 환기를 미리 계획하세요.</div>';
  if (isPassive()) out += '<div class="note">패시브 재배사는 배지 열이 벽으로 덜 빠집니다. 바깥이 시원할 때는 열교환기를 우회해 바깥 공기로 식힙니다.</div>';
  if (c.crop === 'sinryeong') {                                                  // 겨울(바깥 -5°C, 안 25°C) 난방
    var win = envLoad(30) + c.ton * HEAT_VENT * 3 * ventFactor();
    out += (S.equip.ac && win > S.equip.acHeat)
      ? '<div class="note warn">신령버섯은 배지가 20°C 아래면 자라지 않습니다. 한겨울에는 공조 난방(' + S.equip.acHeat + ' kW)이 모자랄 수 있습니다(필요 약 ' + Math.round(win) + ' kW). 보조 난방을 계획하세요.</div>'
      : '<div class="note ok">신령버섯 배지 23-26°C: 한겨울 필요 난방 약 ' + Math.round(win) + ' kW로 공조 난방(' + S.equip.acHeat + ' kW) 안입니다.</div>';
    fm += ', S5 저온';
  }
  out += '<div class="why">문제 해결: ' + fm + '. 측정이 쌓이면 이 재배사의 실제 값으로 계산합니다.</div>';
  return out;
}

/* ---------- 이동 ---------- */
function go(id, arg) { stack.push({ id:id, arg:arg }); render(); }
function back() { stack.pop(); render(); }
function depth() { return stack.length; }

/* ---------- 그리기 ---------- */
var phone = document.getElementById('phone');
function render() {
  document.getElementById('devDepth').textContent = '깊이 ' + depth();
  var html = scrMain();
  for (var i = 0; i < stack.length; i++) {
    var f = stack[i], fn = SCREENS[f.id];
    var out = fn(f.arg, i + 1);
    html += out.modal
      ? '<div class="modal" data-close="1"><div class="mbox">' + out.html + '</div></div>'
      : '<div class="scr">' + out.html + '</div>';
  }
  phone.innerHTML = html;
}
function bar(title, d, opts) {
  opts = opts || {};
  var left = opts.x ? '' : '<button class="b" data-act="back">‹</button>';
  var right = opts.x ? '<button class="b" data-act="back">✕</button>' : '';
  return '<div class="bar">' + left + '<h1>' + title + '</h1><span class="dbadge">깊이 ' + d + '</span>' + right + '</div>';
}

/* 주화면(깊이 0) */
function scrMain() {
  var card;
  if (!S.installed) {
    card = '<section class="card0" data-go="setup"><h2>오늘</h2>' +
      '<div class="muted">농장을 등록하면 재배사마다 오늘 할 일을 알려 드립니다.</div>' +
      '<div style="margin-top:8px"><button class="btn">농장 등록</button></div></section>';
  } else {
    var t = todayTasks(), mine = t.filter(function (x) { return !S.done[x.k] && !x.dev; });
    var late = t.filter(function (x) { return x.g === 'late' && !S.done[x.k]; }).length;
    card = '<section class="card0" data-go="today"><h2>오늘 <span class="chev">›</span></h2>' +
      '<div style="display:flex;gap:16px;align-items:baseline"><span class="big">' + mine.length + '</span><span class="muted">내 할 일</span>' +
      (late ? '<span class="late">밀린 일 ' + late + '</span>' : '') + '</div>' +
      mine.slice(0, 3).map(function (x) { return '<div class="muted">· ' + hname(x) + x.name + '</div>'; }).join('') + '</section>';
  }
  return '<div class="scr"><div class="bar"><h1>FlexFarm</h1><span class="dbadge">깊이 0</span>' +
    '<button class="b" data-go="settings">⚙</button></div><div class="body">' + card +
    '<section><h2>센서</h2><div class="ph">(기존 화면 그대로)</div></section>' +
    '<section><h2>카메라</h2><div class="ph">(기존 화면 그대로)</div></section>' +
    '<section><h2>시스템 상태</h2><div class="ph">(기존 요약, 맨 아래로)</div></section></div></div>';
}
function hname(x) {
  if (x.g === 'farm') return '농장 · ';
  var g = x.g === 'late' ? x.h : x.g, c = S.cycles[g];
  return (c && S.names[c.h] ? S.names[c.h] + ' · ' : '');
}

};
SCREENS.farm = function (a, d) {
  if (!S.installed) return { html: bar('농장 항목', d) + '<div class="body"><section><div class="muted">아직 등록하지 않았습니다.</div>' +
    '<div style="margin-top:8px"><button class="btn" data-act="startSetup">농장 등록</button></div></section></div>' };
  var items = [['농장', (S.farmName || '우리 농장') + ' · 위치'],
               ['시설','재배사 ' + S.houses + '동 · 재배 면적 ' + pyeong(growArea()) + '평 · ' + INSUL[S.bld.insul].name + ' · ' + ['저장고','냉장고','창고'].filter(function (n, k) { return S.shared[['storage','fridge','warehouse'][k]]; }).join(', ')],
               ['설비','공조기, 보일러, ' + (isPassive() ? '열회수 환기기' : '송풍기, 천장 환기구') + ', 순환팬, 가습기 …'],
               ['키우는 작물', S.crops.map(function (k) { return CROPS[k].name + '(주로 ' + MAT[S.byCrop[k].mat] + ')'; }).join(' · ') + ' · 재배법 고친 것 0개'],
               ['단가','인건비, 자재, 기름']];
  return { html: bar('농장 항목', d) + '<div class="body"><section>' + items.map(function (it) {
    return '<div class="row tap" data-go="farmItem" data-arg="' + it[0] + '"><div class="t">' + it[0] + '<div class="s">' + it[1] + '</div></div><span class="chev">›</span></div>';
  }).join('') + '</section><div class="muted" style="padding:0 4px">항목을 바꾸면 그 아래가 다시 계산됩니다. 진행 중인 작기에 영향이 있으면 농장 설정과 같은 경고를 보여 줍니다.</div></div>' };
};
SCREENS.farmItem = function (name, d) {
  return { html: bar(name, d) + '<div class="body"><section><div class="ph">' + name + ' 값 고치기(농장 설정의 같은 단계 화면과 같음, 기능은 나중에)</div></section>' +
    '<section><div class="note warn">저장할 때 진행 중인 작기에 영향이 있으면 목록을 보여 주고 "진행 중인 작기에도 / 새 작기부터만"을 고릅니다.</div></section></div>' };
};

/* ---------- 입력 처리 ---------- */
function snapshot() { return JSON.parse(JSON.stringify({ houses:S.houses, names:S.names, equip:S.equip, crops:S.crops, byCrop:S.byCrop, bld:S.bld, bed:S.bed, fridges:S.fridges })); }
function setupCyclesInit() {
  S.setupCycles = [];
  for (var i = 0; i < 10; i++) S.setupCycles.push({ st: i === 0 ? '진행 중' : i === 1 ? '입상 예정' : '비어 있음', crop:S.crops[0], mat:S.byCrop[S.crops[0]].mat, ton:10, filled:7 });
}
function cycleRef(i) { return i === 'o' ? S.order : S.setupCycles[+i]; }
phone.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act],[data-go],[data-set],[data-setb],[data-sete],[data-cmat],[data-crop],[data-circ],[data-tog],[data-toge],[data-cm],[data-sc],[data-fr],[data-rm],[data-close]');
  if (!el) return;
  if (el.dataset.close && e.target !== el) return;     // 창 안쪽 클릭은 무시
  if (el.dataset.close) { back(); return; }             // 창 밖 누르면 닫힘
  if (el.dataset.go) {
    if (el.dataset.go === 'setup') { S.step = 1; S.mode = 'new'; setupCyclesInit(); }
    go(el.dataset.go, el.dataset.arg); return;
  }
  if (el.dataset.set) { S[el.dataset.set] = el.dataset.v; render(); return; }
  if (el.dataset.setb) { S.bld[el.dataset.setb] = el.dataset.v; render(); return; }
  if (el.dataset.sete) { S.equip[el.dataset.sete] = el.dataset.v; render(); return; }
  if (el.dataset.cmat) { var bc = S.byCrop[el.dataset.cmat]; bc[el.dataset.k] = el.dataset.k === 'state' ? +el.dataset.v : el.dataset.v; render(); return; }
  if (el.dataset.crop) {                               // 키우는 작물: 여러 개, 하나는 남김
    var k = el.dataset.crop, at = S.crops.indexOf(k);
    if (at >= 0) { if (S.crops.length > 1) S.crops.splice(at, 1); }
    else S.crops = CROP_ORDER.filter(function (x) { return x === k || S.crops.indexOf(x) >= 0; });
    render(); return;
  }
  if (el.dataset.circ) { S.byCrop[el.dataset.circ].circ[el.dataset.s] = el.dataset.v === '1'; render(); return; }
  if (el.dataset.tog) { S.shared[el.dataset.tog] = !S.shared[el.dataset.tog]; render(); return; }
  if (el.dataset.toge) { S.equip[el.dataset.toge] = !S.equip[el.dataset.toge]; render(); return; }
  if (el.dataset.cm) {
    var cr = cycleRef(el.dataset.cm); cr[el.dataset.k] = el.dataset.v;
    if (el.dataset.k === 'crop') cr.mat = S.byCrop[el.dataset.v].mat;   // 작물을 바꾸면 그 작물의 기본 배지로
    render(); return;
  }
  if (el.dataset.fr) { S.fridges[+el.dataset.fr].crop = el.dataset.v; render(); return; }
  if (el.dataset.sc) { S.setupCycles[+el.dataset.sc].st = el.dataset.v; render(); return; }
  if (el.dataset.rm) {
    var need = S.saved.houses - S.houses, i = el.dataset.rm;
    if (S.remove[i]) delete S.remove[i];
    else { var ks = Object.keys(S.remove); if (ks.length >= need) delete S.remove[ks[0]]; S.remove[i] = true; }
    render(); return;
  }
  var a = el.dataset.act, c;
  if (a === 'back') back();
  else if (a === 'next') { S.step++; render(); }
  else if (a === 'prev') { S.step--; render(); }
  else if (a === 'hm') { S.houses = Math.max(1, S.houses - 1); trimRemove(); render(); }
  else if (a === 'hp') { S.houses = Math.min(10, S.houses + 1); trimRemove(); render(); }
  else if (a === 'dm') { S.bld.doors = Math.max(1, S.bld.doors - 1); render(); }
  else if (a === 'dp') { S.bld.doors = Math.min(6, S.bld.doors + 1); render(); }
  else if (a === 'bm') { S.equip.boilerN = Math.max(1, S.equip.boilerN - 1); render(); }
  else if (a === 'bp') { S.equip.boilerN = Math.min(10, S.equip.boilerN + 1); render(); }
  else if (a === 'tonm') { c = cycleRef(el.dataset.i); c.ton = Math.max(1, c.ton - 1); render(); }
  else if (a === 'tonp') { c = cycleRef(el.dataset.i); c.ton = Math.min(30, c.ton + 1); render(); }
  else if (a === 'film') { c = cycleRef(el.dataset.i); c.filled = Math.max(1, c.filled - 1); render(); }
  else if (a === 'filp') { c = cycleRef(el.dataset.i); c.filled = Math.min(bedTiers(), c.filled + 1); render(); }
  else if (a === 'addFridge') { S.fridges.push({ crop: S.crops[S.crops.length - 1] }); render(); }
  else if (a === 'rmFridge') { S.fridges.splice(+el.dataset.i, 1); render(); }
  else if (a === 'loc') { S.loc = '위도 36.48 · 경도 127.09 · 해발 45 m(예시)'; render(); }
  else if (a === 'check') { S.done[el.dataset.k] = !S.done[el.dataset.k]; render(); }
  else if (a === 'complete') { S.done[el.dataset.k] = true; S.order = null; back(); }
  else if (a === 'startSetup') { S.step = 1; S.mode = 'new'; setupCyclesInit(); stack = []; go('setup'); }
  else if (a === 'openWizard') {
    if (!S.installed) { S.step = 1; S.mode = 'new'; setupCyclesInit(); stack = []; go('setup'); return; }
    S.mode = 'edit'; S.step = 1; S.saved = snapshot(); S.remove = {}; go('setup');
  }
  else if (a === 'saveEdit') {
    var rm = Object.keys(S.remove).map(Number);
    S.cycles = S.cycles.filter(function (x) { return rm.indexOf(x.h) < 0; });
    var kept = S.saved.names.filter(function (n, i) { return rm.indexOf(i) < 0; });
    S.names = kept.slice(0, S.houses); S.remove = {}; S.saved = null; S.mode = 'new';
    back();
  }
  else if (a === 'finish') {
    var keep = S; demoInstalled();
    ['houses','nameStyle','equip','shared','loc','bld','bed','crops','byCrop','farmName','fridges'].forEach(function (k) { S[k] = keep[k]; });
    S.names = namesFor(keep.nameStyle, keep.houses);
    S.cycles = S.cycles.slice(0, Math.min(3, keep.houses));
    S.cycles.forEach(function (c) { if (S.crops.indexOf(c.crop) < 0) c.crop = S.crops[0]; });   // 데모 작기는 고른 작물 안에서(3동은 신령버섯을 골랐으면 신령버섯)
    stack = []; go('today');
  }
});
function trimRemove() {
  if (!S.saved) return;
  var need = Math.max(0, S.saved.houses - S.houses), ks = Object.keys(S.remove);
  while (ks.length > need) { delete S.remove[ks.pop()]; }
}
document.getElementById('devReset').onclick = function () { S = fresh(); stack = []; render(); };
document.getElementById('devDone').onclick = function () { demoInstalled(); stack = []; render(); };
S = fresh(); render();
</script>
</body>
</html>
