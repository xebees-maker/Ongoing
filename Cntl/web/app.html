    for (var l = 1; l <= 4; l++) {
      h += '<label class="lvl"><input type="checkbox" data-lvl="' + l + '"' + ((dv.mask >> l) & 1 ? ' checked' : '') + (l > dv.save ? ' disabled' : '') + '>' + names[l] + '</label>';
    }
    h += '<select id="devTag">' + dv.tags.map(function (t, i) { return '<option value="' + i + '"' + (i === dv.tag ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div>';
    h += '<div class="logbox" id="logDev"></div>';
    $('sheetBody').innerHTML = h;
    $('logBack').addEventListener('click', function () { clearInterval(logTimer); openSettings(); });
    $('logPause').addEventListener('click', function () { logPaused = !logPaused; this.textContent = S(logPaused ? 'STR_BTN_RESUME' : 'STR_BTN_PAUSE'); if (!logPaused) loadLogs(true); });
    $('devSave').addEventListener('change', function () {
      var v = +this.value;
      setKeyVal('dev_save', v).then(function () { cfg.dev.save = v; renderLogs(); loadLogs(true); }).catch(function () {});
    });
    $('devTag').addEventListener('change', function () {
      var v = +this.value;
      setKeyVal('dev_tag', v).then(function () { cfg.dev.tag = v; loadLogs(true); }).catch(function () {});
    });
    $('sheetBody').querySelectorAll('[data-lvl]').forEach(function (el) {
      el.addEventListener('change', function () {
        var m = 0;
        $('sheetBody').querySelectorAll('[data-lvl]').forEach(function (x) { if (x.checked) m |= 1 << +x.getAttribute('data-lvl'); });
        setKeyVal('dev_mask', m).then(function () { cfg.dev.mask = m; loadLogs(true); }).catch(function () {});
      });
    });
  }
  /* 새 글이 오면 맨 아래로 — 사용자가 위로 올려 읽는 중이면 그대로 둠 */
  function putLog(id, text, force) {
    var el = $(id);
    if (!el || el.textContent === text) return;
    var atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
    el.textContent = text;
    if (force || atBottom) el.scrollTop = el.scrollHeight;
  }
  function loadLogs(force) {
    apiText('api/logs?kind=gen').then(function (t) { putLog('logGen', t, force); }).catch(function () {});
    if (logPaused) return;   /* 콘: 일시멈춤은 Dev Log 화면만 멈춤(줄은 계속 쌓임) */
    apiText('api/logs?kind=dev').then(function (t) { putLog('logDev', t, force); }).catch(function () {});
  }

  /* ── 통계 팝업(콘 build_stats_tab과 같은 기능): 개괄(기간, 공기 T/H 정밀·간이 탭 전환, Agar 혼합→슬롯 순환), 그래프(그룹, 슬롯
   *    표시·숨김, 공기 슬롯 글자 탭 = 정밀·간이, << >> 또는 좌우 밀기 = 이전·다음 창, 탭 = 그 칸의 실측값), 기록 팝업(28개씩, 전체 삭제).
   *    칸 값·추세·저신뢰·개괄 계산은 전부 콘(/api/stats, 콘 화면과 같은 함수) — 여기는 정규화(0~100)와 그리기만 ── */
  var SCALE_SEC = [3600, 43200, 86400, 259200, 604800];
  var XSTEP_SEC = [600, 3600, 7200, 43200, 86400];     /* 콘 s_stats_xaxis_interval_sec */
  var GAP_REF = [70, 60, 50, 40];                       /* 콘 s_stats_gap_ref_height — 창에 실측이 없을 때의 점선 높이 */
  var CHAN_STR = { 1: ['STR_CHAN_LABEL_TEMP_C', 'STR_CHAN_UNIT_TEMP_C'], 2: ['STR_CHAN_LABEL_HUMI_PCT', 'STR_CHAN_UNIT_HUMI_PCT'],
                   3: ['STR_CHAN_LABEL_CO2_PPM', 'STR_CHAN_UNIT_CO2_PPM'], 4: ['STR_CHAN_LABEL_NH3_PPM', 'STR_CHAN_UNIT_NH3_PPM'] };
  var GROUP_KEYS = ['STR_VIEW_GROUP_AIR', 'STR_VIEW_GROUP_AGAR', 'STR_VIEW_GROUP_GAS'];
  var st = null, statsTimer = null, stSeq = 0;
  function slotColor(i) { return i === 2 ? getComputedStyle(document.body).color : ['#f44336', '#2196f3', '', '#fbc02d'][i]; }  /* 콘: 빨강·파랑·검정·짙은 노랑 */
  function prec(p) { return S(p ? 'STR_PRECISION_PRECISE' : 'STR_PRECISION_BASIC'); }
  function f2(v) { return Number(v).toFixed(2); }
  function f1(v) { return Number(v).toFixed(1); }
  function statsBlockedSd(e) { return e && e.message === 'HTTP 503'; }

  function openStats() {
    if (last && last.sd && last.sd.state === 'io_error') { alert(S('STR_MSG_STATS_BLOCKED_SD_FAIL')); return; }   /* 콘 cb_stats_btn_tap과 같음 */
    st = st || { scale: 0, group: 0, tp: true, hp: true, ovT: true, ovH: true, agar: 0, show: [true, true, true, true] };
    st.offset = 0;
    st.data = null;
    openSheet(renderStats);
    loadStats(true);
    startStatsTimer();
  }
  /* 콘처럼 1분마다 다시 받음(가장 짧은 그래프 칸이 1분) */
  function startStatsTimer() {
    clearInterval(statsTimer);
    statsTimer = setInterval(function () { if (sheetRender === renderStats) loadStats(false); }, 60000);
  }
  function loadStats(withBusy) {
    var seq = ++stSeq;
    if (withBusy) busyStart('LOADING');
    api('api/stats?scale=' + st.scale + '&offset=' + st.offset + '&group=' + st.group + '&tp=' + (st.tp ? 1 : 0) + '&hp=' + (st.hp ? 1 : 0))
      .then(function (d) {
        if (seq !== stSeq) return;
        busyEnd();
        st.data = d;
        if (sheetRender === renderStats) renderStats();
      })
      .catch(function (e) {
        if (seq !== stSeq) return;
        busyEnd();
        if (e && e.handled) return;
        if (statsBlockedSd(e)) { alert(S('STR_MSG_STATS_BLOCKED_SD_FAIL')); closeSheet(); return; }
        toast('Error');
      });
  }

  /* 개괄 한 줄 — 탭 가능한 줄은 "라벨[단위]:"가 역상(콘과 같음). 값 = 최대 / 최소 / 평균 */
  function ovRow(key, label, unitKey, m) {
    if (!key && !m) return '<div class="ovrow"><span>' + esc(label + ': ' + S('STR_STATS_OVERVIEW_NO_DATA')) + '</span></div>';
    var head = label + '[' + S(unitKey) + ']:';
    var val = m ? f2(m[0]) + ' / ' + f2(m[1]) + ' / ' + f2(m[2]) : S('STR_STATS_OVERVIEW_NO_DATA');
    return '<div class="ovrow' + (key ? ' tap" data-ov="' + key : '') + '">' + (key ? '<span class="badge">' + esc(head) + '</span>' : '<span>' + esc(head) + '</span>') +
           '<span>' + esc(val) + '</span></div>';
  }
  function slotLabel(sl, i) {
    if (st.data.group === 0) return S(i === 0 ? 'STR_OVERVIEW_AIR_TEMP' : 'STR_OVERVIEW_AIR_HUMI') + '(' + prec(i === 0 ? st.data.tp : st.data.hp) + ')';
    if (st.data.group === 1) return (sl.name || fmt(S('STR_AGAR_SLOT_FMT'), i + 1)) + ' ' + S('STR_CHAN_LABEL_TEMP_C');
    return (sl.name ? sl.name + ' ' : '') + S(CHAN_STR[sl.chan][0]);
  }

  function renderStats() {
    var h = '<div class="shead"><h3 class="grow">' + esc(S('STR_TAB_STATISTICS')) + '</h3><button class="small" id="stRec">' + esc(S('STR_BTN_RECORD')) +
            '</button><button class="xbtn" data-act="close" aria-label="close">&#x2715;</button></div>';
    h += '<div class="field"><strong>' + esc(S('STR_PANEL_STATS_OVERVIEW')) + '</strong><span>' + esc(S('STR_LABEL_PERIOD')) + ' <select id="stScale">' +
         S('STR_STATS_SCALE_OPTIONS').split('\n').map(function (t, i) { return '<option value="' + i + '"' + (i === st.scale ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') +
         '</select></span></div>';
    var d = st.data;
    if (!d) { $('sheetBody').innerHTML = h; bindStats(); return; }
    var ov = d.ov, ai = st.agar % 4, agarLabel, agarVal;
    if (ai === 0) { agarLabel = S('STR_OVERVIEW_AGAR_TEMP'); agarVal = ov.agar_all; }
    else { agarLabel = (ov.agar[ai - 1].name || fmt(S('STR_AGAR_SLOT_FMT'), ai)) + ' ' + S('STR_CHAN_LABEL_TEMP_C'); agarVal = ov.agar[ai - 1].v; }
    /* 콘 줄 순서(왼쪽 T·CO2·Agar, 오른쪽 H·NH3)를 줄 단위로: 넓으면 2열, 세로 휴대폰은 1열 */
    h += '<div class="ovgrid">' +
         ovRow('t', S('STR_OVERVIEW_AIR_TEMP') + '(' + prec(st.ovT) + ')', 'STR_CHAN_UNIT_TEMP_C', ov.air_t[st.ovT ? 1 : 0]) +
         ovRow('h', S('STR_OVERVIEW_AIR_HUMI') + '(' + prec(st.ovH) + ')', 'STR_CHAN_UNIT_HUMI_PCT', ov.air_h[st.ovH ? 1 : 0]) +
         ovRow('', S('STR_CHAN_LABEL_CO2_PPM'), 'STR_CHAN_UNIT_CO2_PPM', ov.co2) +
         ovRow('', S('STR_CHAN_LABEL_NH3_PPM'), 'STR_CHAN_UNIT_NH3_PPM', ov.nh3) +
         ovRow('a', agarLabel, 'STR_CHAN_UNIT_TEMP_C', agarVal) + '</div>';
    /* 그래프 */
    h += '<div class="grp">' + GROUP_KEYS.map(function (k, g) {
      return '<button class="small' + (g === st.group ? ' on' : '') + '" data-grp="' + g + '">' + esc(S(k)) + '</button>';
    }).join('') + '<span class="grow"></span><button class="small" data-pan="1">&lt;&lt;</button><button class="small" data-pan="-1"' +
         (st.offset === 0 ? ' disabled' : '') + '>&gt;&gt;</button></div>';
    var mx = '', mn = '';
    h += '<div class="slots">' + d.slots.map(function (sl, i) {
      var c = slotColor(i), on = st.show[i];
      if (on && sl.min !== undefined) {
        var u = S(CHAN_STR[sl.chan][1]);
        mx += '<span style="color:' + c + '">' + esc(f1(sl.max) + u) + '</span>';
        mn += '<span style="color:' + c + '">' + esc(f1(sl.min) + u) + '</span>';
      }
      return '<span class="slot"><i data-sbox="' + i + '" style="border-color:' + c + ';background:' + (on ? c : 'transparent') + '"></i><span class="tap" data-slab="' + i + '">' +
             esc(slotLabel(sl, i)) + '</span></span>';
    }).join('') + '</div>';
    h += '<div class="mmrow">' + mx + '</div><div class="chartwrap"><canvas id="stChart"></canvas><div id="stTip" class="tip hidden"></div></div>' +
         '<div class="mmrow">' + mn + '</div><div class="xax" id="stXax"></div>';
    $('sheetBody').innerHTML = h;
    bindStats();
    drawStats();
  }

  /* 콘 refresh_stats_graph의 그리기 부분: 계열마다 창 안 최소~최대를 0~100으로, 실선/점선은 칸마다 배타적으로 배정하되
   * 저신뢰와 맞닿은 칸은 양쪽에 넣어 이어 붙임. 창에 실측이 하나도 없으면 고정 높이 점선 */
  var SP = 6;
  function drawStats() {
    var cv = $('stChart');
    if (!cv || !st.data) return;
    var w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1, N = 60;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    function X(i) { return SP + (w - 2 * SP) * i / (N - 1); }
    function Y(n) { return SP + (h - 2 * SP) * (1 - n / 100); }
    g.setLineDash([]);
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(127,127,127,.25)';
    for (var k = 0; k <= 4; k++) { g.beginPath(); g.moveTo(SP, Math.round(Y(k * 25)) + 0.5); g.lineTo(w - SP, Math.round(Y(k * 25)) + 0.5); g.stroke(); }
    st.pts = [];
    function line(a, dash) {
      g.setLineDash(dash);
      g.beginPath();
      var on = false;
      for (var i = 0; i < N; i++) {
        if (a[i] === null) { on = false; continue; }
        if (on) g.lineTo(X(i), Y(a[i])); else { g.moveTo(X(i), Y(a[i])); on = true; }
      }
      g.stroke();
    }
    st.data.slots.forEach(function (sl, s) {
      st.pts[s] = null;
      if (!st.show[s]) return;
      var span = (sl.min !== undefined && sl.max > sl.min) ? sl.max - sl.min : 0;
      var norm = sl.tr.map(function (t) {
        if (t === null) return null;
        var n = span > 0 ? Math.floor((t - sl.min) / span * 100 + 0.5) : 50;
        return Math.max(0, Math.min(100, n));
      });
      function lo(i) { return sl.lo.charAt(i) === '1'; }
      var solid = [], dashed = [];
      for (var i = 0; i < N; i++) {
        if (norm[i] === null) { solid[i] = null; dashed[i] = GAP_REF[s]; continue; }
        var nb = (i > 0 && lo(i - 1) && norm[i - 1] !== null) || (i + 1 < N && lo(i + 1) && norm[i + 1] !== null);
        solid[i] = lo(i) ? null : norm[i];
        dashed[i] = (lo(i) || nb) ? norm[i] : null;
      }
      st.pts[s] = norm;
      g.strokeStyle = slotColor(s);
      g.lineWidth = 2;
      line(solid, []);
      line(dashed, [4, 4]);
    });
    /* X축: 오른쪽 끝 = 이 창의 끝, 라벨 = 지금부터 얼마나 전(콘 refresh_stats_graph_x_labels) */
    var sec = SCALE_SEC[st.data.scale], step = XSTEP_SEC[st.data.scale], cnt = Math.min(sec / step + 1, 13), xs = '';
    /* 휴대폰 폭에선 라벨이 겹침 — 라벨 사이가 34px보다 좁으면 오른쪽(0)부터 k칸마다 하나씩만 */
    var kx = Math.max(1, Math.ceil(34 * (cnt - 1) / Math.max(1, $('stXax').clientWidth)));
    for (var i = 0; i < cnt; i += kx) {
      var inW = i * step, ago = inW + st.data.offset * sec, frac = 1 - inW / sec, t;
      if (ago === 0) t = '0';
      else if (step % 86400 === 0) t = '-' + Math.floor(ago / 86400) + 'd';
      else if (step % 3600 === 0) t = '-' + Math.floor(ago / 3600) + 'h';
      else t = '-' + Math.floor(ago / 60) + 'm';
      xs += '<span style="left:' + (frac * 100) + '%' + (frac >= 1 ? ';transform:translateX(-100%)' : frac <= 0 ? ';transform:none' : '') + '">' + t + '</span>';
    }
    $('stXax').innerHTML = xs;
    st.geom = { w: w, h: h, X: X, Y: Y };
  }

  /* 그래프 탭 — 가장 가까운 칸에서 실측값이 있는 계열 중 탭 높이에 가장 가까운 것(콘 cb_stats_chart_tap) */
  function statsTap(ev) {
    var gm = st.geom, d = st.data;
    if (!gm || !d) return;
    var r = $('stChart').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    var i = Math.max(0, Math.min(59, Math.round((x - SP) / (gm.w - 2 * SP) * 59)));
    var best = -1, bd = 1e9;
    d.slots.forEach(function (sl, s) {
      if (!st.pts[s] || sl.v[i] === null || st.pts[s][i] === null) return;
      var dd = Math.abs(gm.Y(st.pts[s][i]) - y);
      if (dd < bd) { bd = dd; best = s; }
    });
    var tip = $('stTip');
    if (best < 0) { tip.classList.add('hidden'); return; }
    var sl = d.slots[best];
    tip.textContent = S(CHAN_STR[sl.chan][0]) + ': ' + f2(sl.v[i]) + S(CHAN_STR[sl.chan][1]);
    tip.classList.remove('hidden');
    var px = gm.X(i), py = gm.Y(st.pts[best][i]), tw = tip.offsetWidth, th = tip.offsetHeight;
    var tx = Math.max(0, Math.min(gm.w - tw, px - tw / 2)), ty = py - th - 6;
    if (ty < 0) ty = py + 6;
    tip.style.left = tx + 'px';
    tip.style.top = Math.min(gm.h - th, ty) + 'px';
  }

  function statsPan(older) {
    if (older) st.offset++;
    else if (st.offset > 0) st.offset--;
    else return;
    loadStats(true);
  }

  function bindStats() {
    var body = $('sheetBody');
    var sc = $('stScale');
    if (sc) sc.addEventListener('change', function () { st.scale = +this.value; st.offset = 0; loadStats(true); });   /* 콘: 기간을 바꾸면 지금 창으로 */
    var rb = $('stRec');
    if (rb) rb.addEventListener('click', openRecord);
    body.querySelectorAll('[data-ov]').forEach(function (el) {
      el.addEventListener('click', function () {
        var k = el.getAttribute('data-ov');
        if (k === 't') st.ovT = !st.ovT; else if (k === 'h') st.ovH = !st.ovH; else st.agar++;
        renderStats();
      });
    });
    body.querySelectorAll('[data-grp]').forEach(function (el) {
      el.addEventListener('click', function () {
        st.group = +el.getAttribute('data-grp');
        st.show = [true, true, true, true];   /* 콘: 새 그룹은 전부 보이는 채로 시작 */
        loadStats(true);
      });
    });
    body.querySelectorAll('[data-pan]').forEach(function (el) {
      el.addEventListener('click', function () { statsPan(el.getAttribute('data-pan') === '1'); });
    });
    body.querySelectorAll('[data-sbox]').forEach(function (el) {
      el.addEventListener('click', function () { var i = +el.getAttribute('data-sbox'); st.show[i] = !st.show[i]; renderStats(); });
    });
    /* 콘: 공기 슬롯은 글자를 누르면 정밀<->간이, 다른 그룹은 표시·숨김 */
    body.querySelectorAll('[data-slab]').forEach(function (el) {
      el.addEventListener('click', function () {
        var i = +el.getAttribute('data-slab');
        if (st.data && st.data.group === 0) { if (i === 0) st.tp = !st.tp; else st.hp = !st.hp; loadStats(true); }
        else { st.show[i] = !st.show[i]; renderStats(); }
      });
    });
    var cv = $('stChart');
    if (!cv) return;
    cv.addEventListener('click', statsTap);
    var t0 = null;   /* 좌우로 밀기 = 이전·다음 창(오른쪽으로 밀면 과거) */
    cv.addEventListener('touchstart', function (e) { t0 = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
    cv.addEventListener('touchend', function (e) {
      if (!t0 || !e.changedTouches.length) return;
      var dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y;
      t0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) statsPan(dx > 0);
    }, { passive: true });
  }
  window.addEventListener('resize', function () {
    if (sheetRender === renderStats) drawStats();
    if (sheetRender === renderRecord && rec.data) renderRecord();   /* 가로·세로가 바뀌면 한 벌 <-> 두 벌 */
  });

  /* ── 기록 팝업(콘 build_record_tab): 최신이 위, 28개씩, << 10 / < = 더 오래된 쪽, 전체 삭제(확인) ── */
  var rec = { page: 0, data: null };
  function fmtCapped(v) { var a = Math.abs(v); return Number(v).toFixed(a < 100 ? 2 : a < 1000 ? 1 : 0); }   /* 콘 format_value_capped(총 4자리) */
  function openRecord() {
    rec.page = 0;
    rec.data = null;
    openSheet(renderRecord);
    loadRecord();
  }
  function loadRecord() {
    busyStart('LOADING');
    api('api/stats/records?page=' + rec.page).then(function (d) {
      busyEnd();
      rec.data = d;
      if (sheetRender === renderRecord) renderRecord();
    }).catch(function (e) {
      busyEnd();
      if (e && e.handled) return;
      if (statsBlockedSd(e)) { alert(S('STR_MSG_STATS_BLOCKED_SD_FAIL')); closeSheet(); return; }
      toast('Error');
    });
  }
  function renderRecord() {
    var h = '<div class="shead"><h3 class="grow">' + esc(S('STR_TITLE_RECORD')) + '</h3><button class="small danger" id="recDel">' + esc(S('STR_BTN_DELETE_STATS')) +
            '</button><button class="xbtn" id="recBack" aria-label="close">&#x2715;</button></div>';
    var d = rec.data;
    if (d) {
      /* 10-05(사용자 지시) — 가로면 콘처럼 두 벌. 채우는 순서는 왼쪽 열이 다 찬 뒤 오른쪽 열(최신 = 왼쪽 맨 위) */
      var two = window.matchMedia('(orientation: landscape)').matches, sets = two ? 2 : 1;
      var head = '<th>' + esc(S('STR_STATS_TABLE_HEADER_ITEM')) + '</th><th>' + esc(S('STR_STATS_TABLE_HEADER_VALUE')) + '</th><th>' + esc(S('STR_STATS_TABLE_HEADER_TIME')) + '</th>';
      function cells(it) {
        if (!it) return '<td></td><td></td><td class="rsep"></td>';
        var cs = CHAN_STR[it.chan];
        return '<td>' + esc(it.name + (cs ? ' ' + S(cs[0]) : '')) + '</td><td>' + esc(fmtCapped(it.v) + (cs ? S(cs[1]) : '')) + '</td><td class="rsep">' +
               new Date(it.t * 1000).toISOString().substr(11, 8) + '</td>';
      }
      h += '<table class="rtable' + (two ? ' two' : '') + '"><thead><tr>' + head + (two ? head : '') + '</tr></thead><tbody>';
      if (!d.items.length) h += '<tr><td colspan="' + 3 * sets + '">' + esc(S('STR_STATS_TABLE_EMPTY')) + '</td></tr>';
      var rows = Math.ceil(d.items.length / sets);
      for (var r = 0; r < rows; r++) h += '<tr>' + cells(d.items[r]) + (two ? cells(d.items[r + rows]) : '') + '</tr>';
      h += '</tbody></table>';
      var pages = Math.max(1, Math.ceil(d.count / d.page_size)), older = rec.page + 1 < pages, newer = rec.page > 0;
      h += '<div class="pager"><button class="small" data-rpg="10"' + (older ? '' : ' disabled') + '>' + esc(S('STR_BTN_JUMP_PREV10')) + '</button><button class="small" data-rpg="1"' +
           (older ? '' : ' disabled') + '>&lt;</button><span class="sub">' + (rec.page + 1) + ' / ' + pages + '</span><button class="small" data-rpg="-1"' + (newer ? '' : ' disabled') +
           '>&gt;</button><button class="small" data-rpg="-10"' + (newer ? '' : ' disabled') + '>' + esc(S('STR_BTN_JUMP_NEXT10')) + '</button></div>';
    }
    $('sheetBody').innerHTML = h;
    $('recBack').addEventListener('click', function () { openSheet(renderStats); startStatsTimer(); });   /* 콘: 기록 팝업을 닫으면 통계 팝업 */
    $('recDel').addEventListener('click', function () {
      if (!confirm(S('STR_CONFIRM_DELETE_STATS'))) return;
      post('api/stats/delete_all').then(function () { rec.page = 0; loadRecord(); }).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
    });
    $('sheetBody').querySelectorAll('[data-rpg]').forEach(function (b) {
      b.addEventListener('click', function () {
        var pages = Math.max(1, Math.ceil(rec.data.count / rec.data.page_size));
        rec.page = Math.min(pages - 1, Math.max(0, rec.page + (+b.getAttribute('data-rpg'))));
        loadRecord();
      });
    });
  }

  /* ── 전체 화면 보기(웹 전용): 두 손가락 확대·이동, 두 번 탭 = 2배/원래대로. 페이지 확대는 막혀 있어 여기서 직접 처리 ── */
  var vz = { s: 1, x: 0, y: 0 };
  function vApply() { $('viewerImg').style.transform = 'translate(-50%,-50%) translate(' + vz.x + 'px,' + vz.y + 'px) scale(' + vz.s + ')'; }
  function openViewer(url) {
    vz = { s: 1, x: 0, y: 0 };
    $('viewerImg').src = url;
    vApply();
    $('viewer').classList.remove('hidden');
  }
  $('viewerX').addEventListener('click', function () { $('viewer').classList.add('hidden'); $('viewerImg').src = ''; });
  (function () {
    var v = $('viewer'), t0 = null, lastTap = 0;
    function dist(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx * dx + dy * dy); }
    v.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) t0 = { d: dist(e.touches), s: vz.s };
      else if (e.touches.length === 1) {
        var now = Date.now();
        if (now - lastTap < 300) { vz = vz.s > 1 ? { s: 1, x: 0, y: 0 } : { s: 2, x: 0, y: 0 }; vApply(); lastTap = 0; return; }
        lastTap = now;
        t0 = { px: e.touches[0].clientX - vz.x, py: e.touches[0].clientY - vz.y };
      }
    }, { passive: true });
    v.addEventListener('touchmove', function (e) {
      if (!t0) return;
      if (e.touches.length === 2 && t0.d) { vz.s = Math.min(6, Math.max(1, t0.s * dist(e.touches) / t0.d)); if (vz.s === 1) { vz.x = vz.y = 0; } }
      else if (e.touches.length === 1 && t0.px !== undefined && vz.s > 1) { vz.x = e.touches[0].clientX - t0.px; vz.y = e.touches[0].clientY - t0.py; }
      vApply();
    }, { passive: true });
    v.addEventListener('touchend', function (e) { if (e.touches.length === 0) t0 = null; }, { passive: true });
  })();

  /* 시트 닫기(X), 행 탭 → 장치 팝업 */
  $('sheet').addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (t && t.getAttribute('data-act') === 'close') closeSheet();
  });
  $('mainView').addEventListener('click', function (ev) {
    if (ev.target.closest('[data-campop]')) { openCamera(); return; }
    if (ev.target.closest('[data-statspop]')) { openStats(); return; }     /* 센서 판넬 제목 → 통계 팝업(콘과 같음) */   /* 카메라 판넬 제목 → 카메라 팝업(콘과 같음) */
    var ovr = ev.target.closest('[data-ovr]');
    if (ovr) { confirmOverride(+ovr.getAttribute('data-ovr')); return; }   /* 전원 아이콘 → 수동 조작 확인(콘과 같음) */
    var rrow = ev.target.closest('[data-relay]');
    if (rrow) { openRelay(+rrow.getAttribute('data-relay')); return; }
    var row = ev.target.closest('[data-dev]');
    if (row) openDevice(row.getAttribute('data-dev'));
  });

  /* 10-03 — iPhone(Chrome)에서 배율이 1.07로 남아 왼쪽이 비고 오른쪽이 잘림(원인 미확정). 배율이 1이 아니면 viewport 설정을
   * 다시 적용해 1배로 되돌리고 가로 위치도 0으로. 열 때·크기 바뀔 때·입력 마칠 때·팝업 닫을 때 확인 */
  var vpMeta = document.querySelector('meta[name=viewport]');
  var VP = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
  function fixZoom() {
    var vv = window.visualViewport;
    if (!vv || Math.abs(vv.scale - 1) < 0.005) { if (window.scrollX) window.scrollTo(0, window.scrollY); return; }
    vpMeta.setAttribute('content', VP + ', minimum-scale=1');   /* 설정을 바꿨다가 */
    setTimeout(function () { vpMeta.setAttribute('content', VP); window.scrollTo(0, window.scrollY); }, 50);  /* 되돌려 다시 계산시킴 */
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { setTimeout(fixZoom, 300); });
  document.addEventListener('focusout', function () { setTimeout(fixZoom, 300); });
  window.addEventListener('pageshow', function () { setTimeout(fixZoom, 300); });

  applyTexts();
  poll();
  setTimeout(fixZoom, 500);
})();
</script>
</body>
</html>
