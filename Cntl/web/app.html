<!doctype html>
<!--
  2026-10-03(할 일 AD) — 콘 웹앱(SPA). 콘 = 모델 + JSON API, 이 페이지 = 화면.
  설계(Docs 한일 AD):
  - 콘과 같은 UI. 세로 휴대폰 배치 기준(판넬을 콘 순서대로 쌓음), 가로는 넓은 화면에서 2열.
  - 요청은 전부 상대 경로(중계 서비스가 경로 접두어를 붙여도 동작). 실시간 갱신은 주기 조회가 기본.
  - API는 코드만 주고 문구는 여기서 한/영으로. 콘 문구 표(ui_strings.c)는 build_web.py가 아래 STRINGS 자리에 통째로 넣음
    (키 = 콘 STR_ 이름, 값 = [한, 영]). 웹 전용 문구는 W 표. 언어는 브라우저(localStorage)에 저장.
  - 로그인: 401이면 로그인 화면. 성공하면 콘이 1년짜리 토큰 쿠키를 줌. 아이디 칸은 휴대폰 비밀번호 관리자용 고정값.
  - 웹 세션: 화면 API가 409 {"error":"local"}이면 콘에서 넘겨받은 것 — "다시 연결"로 바로 가져옴.
  - 웹에서 뺀 것(사용자 결정): 화면 끄기, 네트워크 조작(상태 표시만), Summary의 Web 주소, 웹 접속 QR, Wi-Fi 팝업.
  빌드·배포: python build_web.py → out/app.html.gz → /admin/upload?file=app.html.gz
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 10-03 — iPhone이 확대(VW 366)된 채 남고 좌우 이동을 막은 뒤엔 되돌릴 수도 없었음 → 배율 1로 고정 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FlexFarm</title>
<!-- 10-05(사용자 요청) — 홈 화면에 추가해 열면 브라우저 상·하단 없이 앱처럼(standalone). 탭 안에서는 페이지가 막대를 숨길 방법이 없음 -->
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="app_icon.png">
<link rel="icon" href="app_icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlexFarm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  :root { --bg:#e5e7eb; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:rgba(127,127,127,.18);
          --green:#16a34a; --blue:#2563eb; --red:#dc2626; --amber:#f5b400; --grey:#9ca3af; --bar:#d1d5db; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#1b1e24; --text:#e5e7eb; --muted:#9ca3af; --bar:#374151; } }
  * { box-sizing:border-box; }
  /* 휴대폰 폭에 맞춤(10-03 — iPhone 13 Pro에서 좌우로 밀렸음): 항목이 줄어들고 긴 글자는 줄바꿈, 그래도 넘치면 페이지가 밀리지 않게 */
  html, body { max-width:100%; overflow-x:hidden; }
  /* 10-03(사용자 지시) — 좌우 스와이프로 화면이 움직이며 VW가 366이 됨 → 세로 스크롤만 허용, 좌우 튕김도 끔.
   * 두 손가락 확대도 같이 막힘 — 사진 전체 화면 보기는 그 화면에서만 따로 허용할 것 */
  html, body { touch-action:pan-y; overscroll-behavior-x:none; }
  /* 앱처럼 열면(viewport-fit=cover) 가로일 때 노치 쪽·아래 홈 막대 자리를 비움 — 브라우저 탭에선 0 */
  body { padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); padding-bottom:env(safe-area-inset-bottom); }
  .sheet { padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); padding-bottom:env(safe-area-inset-bottom); }
  body { margin:0; font:15px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text);
         -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:8px;
           padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; margin:0; font-weight:700; white-space:nowrap; flex-shrink:0; }
  .hright { display:flex; align-items:center; gap:6px; min-width:0; }
  .inv { background:#4b5563; color:#fff; padding:3px 8px; font-size:13px; font-variant-numeric:tabular-nums; flex-shrink:0;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #net { max-width:110px; flex-shrink:1; min-width:0; }
  /* 10-05(사용자 지시) — 누를 수 없는 정보라 역상이 아닌 흐린 글자(역상은 버튼처럼 보였음) */
  .netinfo { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sicon { width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; }
  #conn { font-size:12px; color:var(--muted); text-align:center; padding:4px 0 0; min-height:20px; }
  #conn.bad { color:var(--red); }
  main { padding:6px 8px 24px; max-width:1100px; margin:0 auto; display:grid; grid-template-columns:1fr; gap:8px; }
  @media (orientation: landscape) and (min-width: 700px) { main { grid-template-columns:1fr 1fr; } }
  section { background:var(--card); border-radius:10px; padding:10px 12px; min-width:0; overflow-wrap:anywhere; }
  section h2 { font-size:15px; margin:0 0 6px; font-weight:700; }
  .row { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:none; }
  .grow { flex:1; min-width:0; }
  .sub { font-size:13px; color:var(--muted); }
  .val { font-size:14px; font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); font-size:14px; padding:6px 0; }
  .chev { color:var(--muted); }
  .sig { display:inline-flex; align-items:flex-end; gap:2px; height:16px; }
  .sig i { display:block; width:4px; background:var(--bar); border-radius:1px; }
  .pw { font-size:20px; line-height:1; }
  .red { color:var(--red); }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid rgba(127,127,127,.4); background:transparent; color:var(--text); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  .small { font-size:13px; padding:3px 8px; }
  .center { display:flex; flex-direction:column; align-items:center; gap:14px; padding:48px 16px; text-align:center; }
  input { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid rgba(127,127,127,.4); background:var(--card); color:var(--text); width:240px; }
  .pwwrap { position:relative; }
  .pwwrap input { padding-right:44px; }
  .eye { position:absolute; right:4px; top:50%; transform:translateY(-50%); border:none; padding:6px; color:var(--muted); line-height:0; }
  .msg { font-size:13px; color:var(--red); min-height:18px; }
  .hidden { display:none !important; }
  /* 팝업 = 전체 화면 시트(콘 규칙: 닫기는 오른쪽 위 X, 선택지는 아래 버튼) */
  .sheet { position:fixed; inset:0; z-index:20; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch;
           overflow-x:hidden; touch-action:pan-y; overscroll-behavior:contain; }   /* 10-03 — 팝업도 세로만(자체 스크롤 영역이라 따로) */
  /* 10-05(사용자 결정) — 팝업은 가로·세로 모두 전체 화면 */
  .sbody { background:var(--card); min-height:100%; }
  .shead { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
           background:var(--card); border-bottom:1px solid var(--line); }
  .shead h3 { margin:0; font-size:17px; }
  .xbtn { border:none; font-size:22px; line-height:1; padding:4px 8px; }
  .field { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .field select { max-width:100%; }
  .field label { flex:1; }
  .field input[type=text] { width:auto; flex:1; min-width:0; }
  /* iPhone Safari는 16px 미만 입력칸을 누르면 화면을 확대하고 그대로 남겨 둠(10-03 실기: VW 366, 좌우 이동) → 입력칸은 16px */
  input, select, textarea { font-size:16px !important; }
  select { font:inherit; padding:8px; border-radius:8px; border:1px solid rgba(127,127,127,.4); background:var(--card); color:var(--text); }
  .tg { position:relative; width:46px; height:28px; flex:0 0 46px !important; }
  button:disabled { opacity:.4; }
  .tg input { opacity:0; width:0; height:0; }
  .tg span { position:absolute; inset:0; background:var(--bar); border-radius:14px; transition:.15s; }
  .tg span:before { content:''; position:absolute; width:22px; height:22px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .tg input:checked + span { background:var(--blue); }
  .tg input:checked + span:before { transform:translateX(18px); }
  .sfoot { padding:16px 14px; display:flex; justify-content:flex-end; gap:10px; }
  .danger { color:var(--red); border-color:var(--red); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:30; background:#111827; color:#fff; padding:8px 14px;
           border-radius:8px; font-size:14px; max-width:90vw; }
  /* 10-05(사용자 지시) — 새 알림 토스트는 화면 가운데, 다른 배경색 */
  .toast.alarm { top:50%; bottom:auto; transform:translate(-50%,-50%); background:var(--blue); font-size:15px; padding:14px 18px; text-align:center; width:max-content; max-width:86vw;
                 box-shadow:0 4px 16px rgba(0,0,0,.3); }
  .tap { cursor:pointer; }
  .sent { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .sent input[type=number] { width:90px; }
  /* 값 버튼 + 롤러(콘 open_value_roller_popup과 같은 열 나눔) — 기본 스크롤 + 칸 맞춤이라 관성은 휴대폰 스크롤 그대로 */
  .vbtn { min-width:64px; padding:8px 10px; font-variant-numeric:tabular-nums; }
  .roll { position:relative; display:flex; justify-content:center; align-items:center; gap:2px; padding:8px 14px; }
  .roll .band { position:absolute; left:14px; right:14px; top:50%; height:44px; margin-top:-22px; pointer-events:none;
                border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:rgba(127,127,127,.08); }
  .rcol { height:220px; width:56px; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;
          scrollbar-width:none; touch-action:pan-y; overscroll-behavior:contain; }
  .rcol::-webkit-scrollbar { display:none; }
  .rcol .sp { height:88px; }
  .rcol .it { height:44px; line-height:44px; text-align:center; font-size:24px; scroll-snap-align:center; opacity:.35;
              font-variant-numeric:tabular-nums; }
  .rcol .it.on { opacity:1; font-weight:600; }
  .rfix { font-size:24px; }
  .grayp { background:rgba(127,127,127,.08); }
  .grayp.off { opacity:.45; pointer-events:none; }
  .modal { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px;
           touch-action:pan-y; overflow-x:hidden; }
  .mbox { background:var(--card); border-radius:12px; width:100%; max-width:380px; overflow:hidden; }
  .mtitle { padding:10px 14px; font-weight:700; background:var(--amber); color:#111; }
  .mtext { padding:14px; }
  .choice { padding:6px 14px; border-radius:8px; border:2px solid transparent; }
  .sent > .grow { flex:1; }   /* 10-03(사용자 지시) — 조건 줄: 라벨이 남는 폭을 차지해 칸들이 오른쪽으로 */
  .sent { justify-content:flex-end; }
  /* 카메라 팝업 */
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .prev { padding:12px 14px; border-bottom:1px solid var(--line); text-align:center; }
  .prev img { max-width:100%; max-height:45vh; border-radius:6px; cursor:zoom-in; }
  /* 10-05(사용자 지시) — 목록이 길어 페이지가 늘어짐 → 팝업 높이 안에서 위쪽(선택·버튼·미리보기)은 고정, 목록만 스크롤.
   * 세로 = 미리보기 아래 목록, 가로 = 왼쪽 목록 | 오른쪽 미리보기(콘과 같음) */
  .sbody.cam { height:100%; min-height:0; display:flex; flex-direction:column; }
  .camsplit { flex:1; min-height:0; display:flex; flex-direction:column; }
  .camlist { flex:1; min-height:0; display:flex; flex-direction:column; }
  .plist { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; }
  .camlist .pager { border-top:1px solid var(--line); padding:8px 14px; }
  .prev img { max-height:38vh; }
  @media (orientation: landscape) {
    .camsplit { flex-direction:row; }
    .camsplit > .prev { flex:1; min-width:0; min-height:0; border-bottom:none; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .camsplit > .prev img { flex:0 1 auto; min-height:0; max-height:100%; object-fit:contain; }
    /* 10-05(사용자 지시) — 콘처럼 왼쪽 목록 | 오른쪽 사진 */
    .camsplit > .prev { order:2; }
    .camlist { order:1; flex:1; min-width:0; border-right:1px solid var(--line); }
  }
  .prow { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .prow.sel { background:rgba(37,99,235,.15); }
  .prow .grow { font-size:14px; }
  .pager { display:flex; justify-content:center; align-items:center; gap:6px; padding:12px 14px; }
  /* 오래 걸리는 작업 오버레이(10-03 사용자 요청): 진행률(%)과 경과 시간 */
  .busy { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  .busy .bbox { background:var(--card); border-radius:12px; padding:18px 22px; min-width:220px; text-align:center; }
  .busy .bar { height:6px; background:var(--bar); border-radius:3px; margin-top:12px; overflow:hidden; }
  .busy .bar i { display:block; height:100%; width:0; background:var(--blue); }
  .busy .btxt { font-variant-numeric:tabular-nums; }
  .viewer { position:fixed; inset:0; z-index:50; background:#000; overflow:hidden; touch-action:none; }
  .viewer img { position:absolute; left:50%; top:50%; max-width:100vw; max-height:100vh; transform-origin:center center; user-select:none; -webkit-user-drag:none; }
  .viewer .vx { position:absolute; top:10px; right:10px; z-index:2; color:#fff; border:none; font-size:26px; background:rgba(0,0,0,.4); }
  .choice.sel { border-color:var(--blue); }
  /* 알림(5단계): 종 버튼 + 안 본 개수, 새 알림 배너, 알림 기록 */
  #alarmBtn { position:relative; padding:3px 6px; line-height:0; }
  #alarmCnt { position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--red);
              color:#fff; font-size:11px; line-height:17px; text-align:center; font-variant-numeric:tabular-nums; }
  .arow { padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; overflow-wrap:anywhere; }
  .arow.unread { font-weight:700; background:rgba(37,99,235,.08); }
  .arow .sub { font-weight:400; }
  /* 설정 팝업 */
  .gtitle { padding:16px 14px 6px; font-size:13px; font-weight:700; color:var(--muted); border-bottom:1px solid var(--line); }
  .gsub { padding:12px 14px 4px 26px; font-size:12px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line); }
  .seg button { padding:6px 12px; }
  .seg button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  .help { padding:0 14px 10px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); }
  .field.nb { border-bottom:none; }
  .shead { z-index:3; }   /* 스크롤하면 토글(.tg, position:relative)이 제목줄 위로 올라오던 것 */
  .field .ctl { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px; }
  .field input[type=text], .field input[type=password] { width:100%; }
  .tg input:disabled + span { opacity:.45; }
  .logbox { margin:0 14px 10px; padding:8px; height:34vh; overflow:auto; background:rgba(127,127,127,.08); border-radius:6px;
            font:12px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space:pre-wrap; overflow-wrap:anywhere; touch-action:pan-y; overscroll-behavior:contain; }
  .lvl { display:inline-flex; align-items:center; gap:3px; }
  .lvl input { width:18px; height:18px; }
  #setBtn { padding:3px 6px; line-height:0; }
  /* 통계 팝업 */
  .ovgrid { display:grid; grid-template-columns:1fr; padding:4px 0 8px; border-bottom:1px solid var(--line); }
  @media (min-width: 700px) { .ovgrid { grid-template-columns:1fr 1fr; } }
  .ovrow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:5px 14px; font-size:14px; font-variant-numeric:tabular-nums; }
  .badge { background:var(--text); color:var(--card); padding:2px 6px; border-radius:4px; }
  .grp { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:10px 14px 4px; }
  .grp button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  .slots { display:flex; flex-wrap:wrap; gap:4px 14px; padding:6px 14px; font-size:14px; }
  .slot { display:inline-flex; align-items:center; gap:6px; }
  .slot i { display:inline-block; width:18px; height:18px; border:2px solid; border-radius:4px; cursor:pointer; }
  .mmrow { display:flex; flex-wrap:wrap; gap:2px 12px; padding:0 14px; min-height:18px; font-size:12px; font-variant-numeric:tabular-nums; }
  .chartwrap { position:relative; margin:2px 14px; }
  #stChart { display:block; width:100%; height:240px; touch-action:pan-y; }
  .tip { position:absolute; background:#fef9c3; color:#111; padding:2px 6px; border-radius:4px; font-size:13px; white-space:nowrap; pointer-events:none; }
  .xax { position:relative; height:20px; margin:0 20px 10px; font-size:12px; color:var(--muted); }
  .xax span { position:absolute; top:2px; transform:translateX(-50%); white-space:nowrap; }
  .rtable { width:100%; border-collapse:collapse; table-layout:fixed; font-size:14px; font-variant-numeric:tabular-nums; }
  .rtable th, .rtable td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rtable th:first-child, .rtable td:first-child { padding-left:14px; width:46%; }
  .rtable.two th:first-child, .rtable.two td:first-child { width:22%; }
  .rtable.two th:nth-child(4), .rtable.two td:nth-child(4) { width:22%; padding-left:14px; }
  .rtable.two th:nth-child(3), .rtable.two td.rsep:nth-child(3) { border-right:1px solid var(--line); }
  .tap:active { background:rgba(127,127,127,.12); }
</style>
</head>
<body>
<header>
  <h1 data-s="STR_LOGO_TITLE"></h1>
  <div class="hright">
    <span id="net" class="netinfo"></span>
    <span id="sicon" class="sicon tap" role="button" aria-label="status"></span>
    <button id="alarmBtn" class="small" aria-label="notifications"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="alarmCnt" class="hidden"></span></button>
    <button id="setBtn" class="small" aria-label="settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<!-- 로그인 -->
<form id="loginView" class="center hidden" autocomplete="on">
  <input type="text" name="username" autocomplete="username" value="cntl" class="hidden" readonly>
  <div class="pwwrap">
    <input id="pw" type="password" name="password" autocomplete="current-password" data-w-ph="PASSWORD">
    <button id="pwEye" type="button" class="eye" aria-label="show password">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
        <line id="pwEyeSlash" x1="3" y1="21" x2="21" y2="3"/>

<!-- 콘에서 넘겨받음 -->
<div id="localView" class="center hidden">
  <div data-w="LOCAL_IN_USE"></div>
  <button id="reclaimBtn" class="primary" data-w="RECONNECT"></button>
</div>

<!-- 주화면 — 콘 판넬 순서: Summary → Power Control → Sensor → Camera -->
<div id="mainView" class="hidden">
  <div id="conn"></div>
  <main>
    <section>
      <h2 data-s="STR_PANEL_SUMMARY"></h2>
      <div id="sumMem" class="val"></div>
      <div id="sumSd" class="val"></div>
    </section>
    <section>
      <h2 data-s="STR_PANEL_POWER_CONTROL"></h2>
      <div id="relays"></div>
    </section>
    <section>
      <h2 data-s="STR_GROUP_SENSOR" data-statspop="1" class="tap"></h2>
      <div id="sens"></div>
    </section>
    <section>
      <h2 data-s="STR_GROUP_CAMERA" data-campop="1" class="tap"></h2>
      <div id="cams"></div>
    </section>
  </main>
  <!-- 10-03 진단 — 휴대폰에서 주소 입력 대신 누르기(링크로 ?debug=1 페이지 열기) -->
  <div style="text-align:center;padding:8px 0 20px"><a href="?debug=1" style="font-size:12px;color:var(--muted)">debug</a></div>
</div>

<div id="sheet" class="sheet hidden"><div class="sbody" id="sheetBody"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"><div class="mbox" id="modalBox"></div></div>
<div id="busy" class="busy hidden"><div class="bbox"><div id="busyTxt" class="btxt"></div><div class="bar" id="busyBar"><i id="busyFill"></i></div></div></div>
<div id="viewer" class="viewer hidden"><button class="vx" id="viewerX" aria-label="close">&#x2715;</button><img id="viewerImg" alt=""></div>

<script>
(function () {
  'use strict';
  var POLL_MS = 5000;

  /* 콘 문구 표 — build_web.py가 채움: { STR_X: [한, 영] } */
  var STR = /*@STRINGS@*/;
  /* 에러·경고 코드 → 설명 문구 키 — build_web.py가 콘 err/warn_code_to_desc_str에서 뽑아 채움 */
  var ERRDESC = /*@ERRDESC@*/;
  /* 웹 전용 문구 */
  var W = {
    PASSWORD: ['비밀번호', 'Password'], LOGIN: ['로그인', 'Log in'], LOGIN_FAILED: ['비밀번호가 맞지 않습니다', 'Wrong password'],
    LOCAL_IN_USE: ['콘에서 사용 중입니다', 'Cntl is being used on its screen'], RECONNECT: ['다시 연결', 'Reconnect'],
    OFFLINE: ['연결 끊김', 'Offline'], WEB: ['웹', 'Web'],
    LOADING: ['받는 중', 'Loading'], CAPTURING: ['촬영 중', 'Capturing'], NO_PHOTO: ['사진이 오지 않았습니다', 'No photo arrived'],
    SEC: ['초', 's'],
    NOTIFY: ['알림', 'Notifications'], SECURITY: ['보안', 'Security'],
    N_TYPES: [['에러', 'Errors'], ['경고', 'Warnings'], ['릴레이 켜짐·꺼짐', 'Relay on/off'], ['장치 연결 끊김', 'Device disconnected'],
              ['SD 오류', 'SD error'], ['배터리 부족', 'Low battery'], ['CAN 버스 이상', 'CAN bus fault']],
    TOPIC: ['ntfy 토픽', 'ntfy topic'], CLICK: ['알림을 누르면 열 주소', 'Click URL'], TEST_SEND: ['시험 알림 보내기', 'Send test'],
    SENT: ['보냈습니다', 'Sent'], SAVED: ['저장했습니다', 'Saved'], INVALID: ['형식이 맞지 않습니다', 'Invalid format'],
    TIME_PHONE: ['휴대폰 시각으로', 'Use phone time'], PW_OLD: ['지금 비밀번호', 'Current password'], PW_NEW: ['새 비밀번호', 'New password'],
    PW_CHANGE: ['비밀번호 변경', 'Change password'], PW_CHANGED: ['비밀번호를 바꿨습니다', 'Password changed'],
    PW_FAIL: ['비밀번호를 바꾸지 못했습니다', 'Password not changed'], LOGOUT_ALL: ['모든 기기 로그아웃', 'Log out all devices'],
    LOGOUT_ALL_CONFIRM: ['모든 기기에서 로그아웃합니다. 이 기기도 다시 로그인해야 합니다.', 'All devices will be logged out, including this one.'],
    RESTARTING: ['재시작합니다', 'Restarting'],
    NOT_PUSHED: ['보내지 않음(꺼진 종류)', 'Not sent (type off)'], NO_ALARMS: ['알림이 없습니다', 'No notifications']
  };
  /* 센서 채널 종류(esp_now_link.h SENSOR_CHAN_*) → 콘 주화면과 같은 글자·단위 */
  var CHAN = { 1: ['T', 'STR_CHAN_UNIT_TEMP_C'], 2: ['H', 'STR_CHAN_UNIT_HUMI_PCT'], 3: ['C', 'STR_CHAN_UNIT_CO2_PPM'], 4: ['A', 'STR_CHAN_UNIT_NH3_PPM'] };
  var CHAN_CO2 = 3;
  var STATUS_KEY = { waiting: 'STR_STATUS_CONNECTING', active: 'STR_STATUS_ACTIVE', paired: 'STR_STATUS_PAIRED' };

  var lang = 'ko';
  try { lang = localStorage.getItem('lang') || ((navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en'); } catch (e) {}
  function li() { return lang === 'ko' ? 0 : 1; }
  function S(k) { var v = STR[k]; return v ? v[li()] : k; }
  function Wt(k) { var v = W[k]; return v ? v[li()] : k; }
  function fmt(s) { var a = arguments, i = 1; return s.replace(/%d|%s|%u/g, function () { return a[i++]; }); }

  var timer = null, view = '', last = null;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function applyTexts() {
    document.documentElement.lang = lang;
    document.title = S('STR_LOGO_TITLE');
    [].forEach.call(document.querySelectorAll('[data-s]'), function (el) { el.textContent = S(el.getAttribute('data-s')); });
    [].forEach.call(document.querySelectorAll('[data-w]'), function (el) { el.textContent = Wt(el.getAttribute('data-w')); });
    [].forEach.call(document.querySelectorAll('[data-w-ph]'), function (el) { el.placeholder = Wt(el.getAttribute('data-w-ph')); });
    if (last) render(last);
    if (sheetRender) sheetRender();
  }

  function show(v) {
    view = v;
    $('loginView').classList.toggle('hidden', v !== 'login');
    $('localView').classList.toggle('hidden', v !== 'local');
    $('mainView').classList.toggle('hidden', v !== 'main');
    if (v !== 'main') { clearTimeout(timer); wsStop(); }
    if (v === 'login') setTimeout(function () { $('pw').focus(); }, 0);
  }

  /* 공통 요청 — 401이면 로그인, 409(local)면 넘겨받음 화면 */
  function api(path, opts) {
    opts = opts || {};
    opts.cache = 'no-store';
    opts.credentials = 'same-origin';
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { show('login'); throw { handled: true }; }
      if (r.status === 409) { show('local'); throw { handled: true }; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  /* ── 표시 규칙(콘 ui_main.c와 같게) ── */
  function bytesHuman(b) { return b >= 1048576 ? (b / 1048576).toFixed(2) + 'MB' : (b / 1024).toFixed(1) + 'KB'; }
  function signalHtml(n) {
    /* update_signal_widget: RSSI → 칸 수, 색 = 곧 끊김 빨강 / 통신 중 파랑 / 페어됨 초록 */
    var r = n.rssi, f = (r === undefined) ? 0 : r >= -45 ? 5 : r >= -55 ? 4 : r >= -65 ? 3 : r >= -75 ? 2 : r >= -85 ? 1 : 0;
    var c = n.near_orphan ? 'var(--red)' : n.status === 'active' ? 'var(--blue)' : 'var(--green)';
    var h = '<span class="sig">';
    for (var i = 0; i < 5; i++) h += '<i style="height:' + (4 + i * 3) + 'px;' + (i < f ? 'background:' + c : '') + '"></i>';
    return h + '</span>';
  }
  function nodeName(n) { return n.alias || n.name; }

  function renderSummary(d) {
    $('sumMem').textContent = S('STR_LABEL_MEMORY') + ': I = ' + bytesHuman(d.mem.i) + ' / P = ' + bytesHuman(d.mem.p);
    var sd = d.sd || {}, el = $('sumSd');
    el.className = 'val';
    if (sd.state === 'io_error') { el.textContent = 'SD: ' + S('STR_STATUS_SD_IO_ERROR_MSG'); el.className = 'val red'; return; }
    if (sd.state === 'unmounted') { el.textContent = 'SD: ' + S('STR_STATUS_SD_UNMOUNTED'); el.className = 'val red'; return; }
    if (sd.state !== 'ok') { el.textContent = ''; return; }
    var names = { picture: 'STR_LABEL_PICTURE', measure: 'STR_LABEL_MEASURE_SHORT', total: 'STR_LABEL_TOTAL' };
    el.textContent = 'SD: ' + S('STR_LABEL_STORAGE_LEGEND') + ' ' + sd.areas.map(function (a) {
      return S(names[a.id]) + ' ' + a.pct + '(' + a.remain_mb + ')';
    }).join(' / ');
  }

  function relaySummary(r) {
    /* refresh_power_control_panel과 같은 문장 — 언어별 어순 틀(STR_FMT_RELAY_SUMMARY, 콘 fill_relay_summary와 같은 규칙) */
    if (r.override) return S(r.override_on ? 'STR_MSG_OVERRIDE_ON_SUMMARY' : 'STR_MSG_OVERRIDE_OFF_SUMMARY');
    if (!r.configured) return S('STR_RELAY_NOT_CONFIGURED');
    var num = r.center === null ? '-' : (r.chan === CHAN_CO2 ? String(Math.round(r.center)) : Number(r.center).toFixed(1));
    var parts = { act: S(r.turns_on ? 'STR_STATUS_RELAY_ON' : 'STR_STATUS_RELAY_OFF'),
                  item: S(r.chan === CHAN_CO2 ? 'STR_CHANNEL_NAME_CO2' : 'STR_CHANNEL_NAME_TEMP'),
                  dir: S(r.rises ? 'STR_DIRECTION_NAME_UPTO' : 'STR_DIRECTION_NAME_BELOW'), value: num };
    return S('STR_FMT_RELAY_SUMMARY').replace(/\{(act|item|dir|value)\}/g, function (m, k) { return parts[k]; });
  }

  function renderRelays(list) {
    $('relays').innerHTML = list.map(function (r) {
      var name = r.alias || fmt(S('STR_RELAY_DEFAULT_NAME_FMT'), r.idx + 1);
      return '<div class="row tap" data-relay="' + r.idx + '"><span class="pw" data-ovr="' + r.idx + '" style="color:' + (r.on ? 'var(--green)' : 'var(--grey)') + ';padding:4px 8px">&#x23FB;</span>' +
        '<span>' + esc(name) + '</span><span class="grow val" style="text-align:right">' + esc(relaySummary(r)) + '</span>' +
        '<span class="chev">&gt;</span></div>';
    }).join('');
  }

  function sensorValues(n) {
    if (!n.chans) return '';
    return n.chans.filter(function (c) { return CHAN[c.type]; }).map(function (c) {
      var tag = CHAN[c.type][0];
      if (!c.ok) return tag + ':' + S('STR_SENSOR_VALUE_PENDING');
      if (c.invalid) return tag + ':' + S('STR_SENSOR_VALUE_INVALID');
      return tag + ': ' + (c.val === null ? '-' : Number(c.val).toFixed(2)) + S(CHAN[c.type][1]);
    }).join(' ');
  }

  /* 촬영 주기 — 콘 format_capture_interval과 같게(값 목록 = ui_main.c s_capture_interval_values, 문구 = STR_OPT_CAPTURE_INTERVAL_LIST) */
  var CAPTURE_VALUES = [0, 10, 30, 1800, 3600, 10800, 36000];
  function captureText(sec) {
    var i = CAPTURE_VALUES.indexOf(sec);
    if (i < 0) return sec + 's';
    return S('STR_OPT_CAPTURE_INTERVAL_LIST').split('\n')[i] || (sec + 's');
  }

  function renderSensors(nodes) {
    var list = nodes.filter(function (n) { return n.kind === 'sens' && n.status !== 'waiting'; });
    if (!list.length) { $('sens').innerHTML = '<div class="empty">' + esc(S('STR_PANEL_NO_SENSOR')) + '</div>'; return; }
    $('sens').innerHTML = list.map(function (n) {
      var head = nodeName(n) + ' / ' + S('STR_LABEL_MEASURE_TINY') + ' ' + n.interval_s + 's';
      if (n.battery !== undefined) head += ' / ' + S('STR_LABEL_BATTERY_TINY') + ' ' + n.battery + '%';
      var v = sensorValues(n);
      return '<div class="row tap" data-dev="' + esc(n.mac) + '">' + signalHtml(n) + '<div class="grow"><div>' + esc(head) + '</div>' +
        (v ? '<div class="val">' + esc(v) + '</div>' : '') + '</div><span class="chev">&gt;</span></div>';
    }).join('');
  }

  function renderCams(nodes) {
    var list = nodes.filter(function (n) { return n.kind === 'cam' && n.status !== 'waiting'; });
    if (!list.length) { $('cams').innerHTML = '<div class="empty">' + esc(S('STR_PANEL_NO_CAMERA')) + '</div>'; return; }
    /* 콘 주화면 카메라 행과 같게: "이름 / P 촬영주기 / Bat% / AGC / AEC"(AGC·AEC는 켜졌을 때만), 상태는 신호 색으로만 */
    $('cams').innerHTML = list.map(function (n) {
      var t = nodeName(n) + ' / ' + S('STR_LABEL_CAPTURE_TINY') + ' ' + captureText(n.capture_s);
      if (n.battery !== undefined) t += ' / ' + S('STR_LABEL_BATTERY_TINY') + ' ' + n.battery + '%';
      if (n.agc) t += ' / ' + S('STR_LABEL_AGC_TINY');
      if (n.aec) t += ' / ' + S('STR_LABEL_AEC_TINY');
      return '<div class="row tap" data-dev="' + esc(n.mac) + '">' + signalHtml(n) + '<div class="grow">' + esc(t) + '</div><span class="chev">&gt;</span></div>';
    }).join('');
  }

  function renderHeader(d) {
    /* 콘 시계는 현지 시각을 그대로 초로 셈(타임존 없음) — UTC로 풀어야 콘 화면과 같은 값 */
    $('net').textContent = (d.net.mode === 'ap' ? 'AP' : 'STA') + (d.net.ssid ? ' ' + d.net.ssid : '');
    var col = d.status === 'error' ? 'var(--red)' : d.status === 'warning' ? 'var(--amber)' : 'var(--green)';
    /* 정상 = 초록 원 안의 체크(사용자 선택 10-03), 경고·에러 = 노랑·빨강 삼각형 */
    $('sicon').innerHTML = d.status === 'normal'
      ? '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="11" fill="' + col + '"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 1 21h22z" fill="' + col + '"/><path d="M12 9v5M12 17v.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
  }

  /* 저장 공간 정리 안내 — 처음 받은 번호는 기준으로만 삼고, 그 뒤 번호가 바뀌면 콘 팝업과 같은 문구로 알림 */
  var cleanupSeq = null;
  function checkCleanup(c) {
    if (!c) return;
    if (cleanupSeq !== null && c.seq !== cleanupSeq) {
      var names = ['STR_LABEL_PICTURE', 'STR_LABEL_MEASURE_SHORT'];
      c.deleted.forEach(function (n, a) {
        if (n > 0) alert(S('STR_TITLE_NOTICE') + '\n\n' + fmt(S('STR_MSG_STORAGE_CLEANUP'), S(names[a]), n));
      });
    }
    cleanupSeq = c.seq;
  }

  function render(d) {
    checkCleanup(d.cleanup);
    checkAlarms(d.alarm);
    renderHeader(d);
    renderSummary(d);
    renderRelays(d.relays || []);
    renderSensors(d.nodes || []);
    renderCams(d.nodes || []);
  }

  function onDash(d) {
    if (view !== 'main') show('main');
    last = d;
    render(d);
    $('conn').textContent = '';
    $('conn').className = '';
  }

  /* 처음 열 때·팝업을 닫을 때·WebSocket이 끊겼을 때 한 번 받아 옴. WebSocket이 붙어 있으면 그것으로 끝, 아니면 5초 뒤 다시 */
  function poll() {
    api('api/dashboard')
      .then(function (d) {
        onDash(d);
        wsStart();
        schedule();
      })
      .catch(function (e) {
        if (e && e.handled) return;
        $('conn').textContent = Wt('OFFLINE');
        $('conn').className = 'bad';
        schedule();
      });
  }

  function schedule() {
    clearTimeout(timer);
    if (!document.hidden && view === 'main' && !wsOk) timer = setTimeout(poll, POLL_MS);
  }

  /* ── WebSocket(10-05 사용자 지시 — 5초 조회 대신): 콘이 바뀐 것이 있을 때 주화면 내용을 밀어 줌. 5초마다 "hb"로 웹 세션 유지
   *    (휴대폰이 잠기면 hb가 끊겨 콘이 20초 뒤 세션을 끝내고 알림을 ntfy로 넘김). 끊기면 5초 조회로 돌아가고 10초 뒤 다시 붙음 ── */
  var ws = null, wsOk = false, hbTimer = null, wsNextTry = 0;
  function wsUrl() {
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.pathname.replace(/[^\/]*$/, '') + 'ws';
  }
  function wsStart() {
    if (ws || document.hidden || view !== 'main' || Date.now() < wsNextTry || !window.WebSocket) return;
    wsNextTry = Date.now() + 10000;
    try { ws = new WebSocket(wsUrl()); } catch (e) { ws = null; return; }
    ws.onopen = function () {
      wsOk = true;
      clearTimeout(timer);
      try { ws.send('hb'); } catch (e) {}   /* 콘은 첫 hb를 받을 때 이 연결을 등록하고 첫 내용을 보냄 */
      hbTimer = setInterval(function () { try { ws.send('hb'); } catch (e) {} }, 5000);
    };
    ws.onmessage = function (ev) {
      var d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.error === 'local') { wsStop(); show('local'); return; }
      onDash(d);
    };
    ws.onclose = ws.onerror = function () {
      var was = wsOk;
      wsStop();
      if (view === 'main' && !document.hidden) { if (was) poll(); else schedule(); }
    };
  }
  function wsStop() {
    clearInterval(hbTimer);
    if (ws) { ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null; try { ws.close(); } catch (e) {} }
    ws = null;
    wsOk = false;
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearTimeout(timer); wsStop(); }
    else if (view === 'main' || view === '') { wsNextTry = 0; poll(); }
  });

  $('loginView').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('loginMsg').textContent = '';

  /* 진단(10-03 — 한국어에서만 휴대폰 폭을 넘음): 주소에 ?debug=1이면 화면 밖으로 나간 요소를 위에 띄움. 배치는 안 바꿈 */
  if (/[?&]debug=1/.test(location.search)) {

                        'background:rgba(0,0,0,.85);color:#0f0;font:11px/1.3 monospace;white-space:pre-wrap;width:100vw;';
    document.body.appendChild(dbg);

      var iw = document.documentElement.clientWidth;

          lines.push(e.tagName.toLowerCase() + (e.id ? '#' + e.id : '') + (e.className && typeof e.className === 'string' ? '.' + e.className.replace(/ /g, '.') : '') +
                     ' R=' + Math.round(r.right) + ' W=' + Math.round(r.width) + ' "' + (e.textContent || '').trim().slice(0, 24) + '"');

  /* ── 공통: 토스트, 시트 ── */

  /* 10-03(사용자 지시 — 주화면과 모든 팝업에서 뒤로·앞으로 이동 막기) — 브라우저 기록 맨 위에 늘 "막이" 한 칸을 둠.

  /* ── 수동 조작 확인(콘 show_override_confirm_popup과 같은 문장: 경고 + "~할까요, [On] 또는 [Off]" + 예/아니오) ── */
  function confirmOverride(idx, onDone, onCancel) {
    var sel = true;
    function draw() {
      /* 경고문(언어별 문장) 아래에 선택 칸만(언어와 상관없이 같은 배치) — 콘 show_override_confirm_popup과 같음 */

        esc(S('STR_MSG_OVERRIDE_WARNING')) + '<div style="display:flex;gap:12px;justify-content:center;margin-top:14px">' +
        '<button class="choice' + (sel ? ' sel' : '') + '" data-c="1">' + esc(S('STR_STATUS_RELAY_ON')) + '</button>' +

      } else if (onCancel) onCancel();

  /* ── 릴레이 팝업(콘 build_relay_popup과 같은 항목·규칙) — 본 설정은 Apply(값이 바뀌었을 때만 켜짐), 별명은 따로 Apply,
   *    Manual 켜기는 확인 팝업에서 방향까지 정하고 바로 적용, Manual 끄기는 Apply로 ── */
  var rl = null, rlSnap = null;
  function rlForm() {   /* 화면 선택값 → 서버로 보낼 본문 */
    var f = rl.form;
    return ['chan=' + f.chan, 'y=' + (f.y ? 1 : 0), 'z=' + (f.z ? 1 : 0), 'center=' + f.center, 'margin=' + f.margin,
            'ai=' + (f.ai ? 1 : 0), 'manual=' + (f.manual ? 1 : 0), 'src=' + f.src, 'gc=' + f.gc, 'dev=' + (f.dev || ''),
            'stat=' + f.stat, 'trend=' + (f.trend ? 1 : 0), 'ts=' + f.ts, 'hold=' + f.hold].join('&');
  }
  function rlChan(type) { return rl.data.chans.filter(function (c) { return c.type === type; })[0] || rl.data.chans[0]; }
  function rlSpec() {   /* 값 범위 — 온도 그룹이면 기본/정밀 선택대로, 장치면 정밀(서버가 실제 센서 사양으로 다시 자름) */
    var f = rl.form, ch = rlChan(f.chan);
    var fine = f.src === 1 ? true : (f.chan === 1 && f.gc === 1);
    return ch.spec[fine ? 1 : 0];
  }
  function openRelay(idx) {

      rl = { data: d, form: { chan: d.chan, y: d.y, z: d.z, center: d.center, margin: d.margin, ai: d.ai, manual: d.manual, src: d.src,
                              gc: d.gc, dev: devs.some(function (x) { return x.mac === d.dev; }) ? d.dev : (devs[0] ? devs[0].mac : ''),
                              stat: d.stat, trend: d.trend, ts: d.ts, hold: d.hold }, alias: d.alias };
      rlSnap = rlForm();
      openSheet(renderRelay);
    }).catch(function () {});
  }
  function rlChanDevices(d, type) { var c = d.chans.filter(function (x) { return x.type === type; })[0]; return c ? c.devices : []; }
  function sel(id, listKey, values, cur, extra) {
    var labels = S(listKey).split('\n');
    return '<select id="' + id + '"' + (extra || '') + '>' + values.map(function (v, i) {

  function renderRelay() {
    var d = rl.data, f = rl.form, sp = rlSpec(), dec = sp[3];
    var unit = S(f.chan === 3 ? 'STR_UNIT_CO2' : 'STR_UNIT_TEMP');

         '<label style="text-align:right">' + esc(S('STR_LABEL_MANUAL_MODE')) + '</label>' + toggleHtml('rManual', f.manual) + '</div>';
    h += '<div class="grayp' + (f.manual ? ' off' : '') + '">';
    /* 입력 칸은 언어와 상관없이 같은 배치(사용자 결정): 동작 / 항목 / 조건 */
    h += '<div class="field"><label>' + esc(S('STR_LABEL_RELAY_ACTION')) + '</label>' + sel('rZ', 'STR_OPT_TURN_ACTION_LIST', [1, 0], f.z ? 1 : 0) + '</div>';
    h += '<div class="field"><label>' + esc(S('STR_LABEL_RELAY_ITEM')) + '</label>' +
         sel('rChan', 'STR_OPT_CHAN_TYPE_LIST', d.chans.map(function (c) { return c.type; }), f.chan) + '</div>';
    h += '<div class="sent"><span class="grow">' + esc(S('STR_LABEL_RELAY_CONDITION')) + '</span>' + sel('rY', 'STR_OPT_RISE_FALL_LIST', [1, 0], f.y ? 1 : 0) +
         '<button class="vbtn" data-roll="center">' + Number(f.center).toFixed(dec) + '</button>' + esc(S('STR_SENTENCE_PLUSMINUS')) +
         '<button class="vbtn" data-roll="margin">' + Number(f.margin).toFixed(dec) + '</button>' + esc(unit) + '</div>';
    if (!f.ai) {

      if (f.src === 0 && f.chan === 1) h += sel('rGc', 'STR_OPT_GROUP_CHOICE_TEMP_LIST', [0, 1, 2], f.gc);

           sel('rTs', 'STR_OPT_TREND_SAMPLE_LIST', d.opt_ts, f.ts, f.trend ? '' : ' disabled') + '</div>';
      h += '<div class="field"><label>' + esc(S('STR_LABEL_MIN_HOLD')) + '</label>' + sel('rHold', 'STR_OPT_MIN_HOLD_LIST', d.opt_hold, f.hold) + '</div>';

  /* 롤러 — 콘 open_value_roller_popup과 같은 나눔: 온도(소수 1자리) = [정수] . [0~9], CO2(10 단위) = [천][백][십] + "0".
   * 범위는 콘과 같은 표(서버 spec: [최소, 최대, 단위, 소수 자리, 오차 최대]) — 오차는 0~오차 최대 */
  var ROW = 44;
  function rollCol(id, a, b, cur) {
    var h = '<div class="rcol" id="' + id + '"><div class="sp"></div>';
    for (var i = a; i <= b; i++) h += '<div class="it" data-v="' + i + '">' + i + '</div>';
    return { html: h + '<div class="sp"></div></div>', a: a, cur: Math.min(b, Math.max(a, cur)) };
  }
  function colValue(id, a) { var c = $(id); return a + Math.round(c.scrollTop / ROW); }
  function markCol(id) {
    var c = $(id), k = Math.round(c.scrollTop / ROW);
    [].forEach.call(c.querySelectorAll('.it'), function (e, i) { e.classList.toggle('on', i === k); });
  }
  function openRoller(key, onOk) {
    var sp = rlSpec(), f = rl.form, isMargin = key === 'margin';
    var lo = isMargin ? 0 : sp[0], hi = isMargin ? sp[4] : sp[1], v = f[key];
    var unit = S(f.chan === 3 ? 'STR_UNIT_CO2' : 'STR_UNIT_TEMP');
    var cols = [], h = '';
    if (sp[3] > 0) {
      var whole = Math.floor(v + 1e-6), frac = Math.round((v - whole) * 10);
      if (frac > 9) { frac = 0; whole += 1; }
      var c1 = rollCol('rcI', Math.floor(lo), Math.floor(hi), whole), c2 = rollCol('rcF', 0, 9, frac);
      cols = [['rcI', c1], ['rcF', c2]];
      h = c1.html + '<span class="rfix">.</span>' + c2.html + '<span class="rfix">' + esc(unit) + '</span>';
    } else {
      var t = Math.max(0, Math.round(v)), maxTh = Math.round(hi / 1000);
      var a1 = rollCol('rcT', 0, maxTh, Math.floor(t / 1000)), a2 = rollCol('rcH', 0, 9, Math.floor(t / 100) % 10),
          a3 = rollCol('rcE', 0, 9, Math.floor(t / 10) % 10);
      cols = [['rcT', a1], ['rcH', a2], ['rcE', a3]];
      h = a1.html + a2.html + a3.html + '<span class="rfix">0 ' + esc(unit) + '</span>';
    }
    $('modalBox').innerHTML = '<div class="mtitle" style="background:var(--blue);color:#fff">' + esc(S('STR_TITLE_SETTING')) + '</div>' +
      '<div class="roll"><div class="band"></div>' + h + '</div>' +
      '<div class="sfoot"><button data-m="no">' + esc(S('STR_BTN_CANCEL')) + '</button><button class="primary" data-m="yes">' + esc(S('STR_BTN_CONFIRM')) + '</button></div>';
    $('modal').classList.remove('hidden');
    cols.forEach(function (c) {
      var el = $(c[0]);
      el.scrollTop = (c[1].cur - c[1].a) * ROW;
      markCol(c[0]);
      el.addEventListener('scroll', function () { markCol(c[0]); }, { passive: true });
    });
    $('modal').onclick = function (ev) {
      var m = ev.target.closest('[data-m]');
      if (!m) return;
      if (m.getAttribute('data-m') === 'yes') {
        var nv = sp[3] > 0 ? colValue('rcI', cols[0][1].a) + colValue('rcF', 0) / 10
                           : colValue('rcT', 0) * 1000 + colValue('rcH', 0) * 100 + colValue('rcE', 0) * 10;
        if (nv > hi || nv < lo) { nv = Math.min(hi, Math.max(lo, nv)); toast(S('STR_MSG_RELAY_VALUE_CLAMPED')); }
        onOk(Number(nv.toFixed(sp[3])));
      }
      $('modal').classList.add('hidden');
      $('modal').onclick = null;
    };
  }

  function rlDirty() { var b = $('rApply'); if (b) b.disabled = (rlForm() === rlSnap); }
  function bindRelay() {
    var f = rl.form, d = rl.data;
    function on(id, ev, fn) { var el = $(id); if (el) el.addEventListener(ev, fn); }

    on('rZ', 'change', function () { f.z = this.value === '1'; rlDirty(); });
    on('rY', 'change', function () { f.y = this.value === '1'; rlDirty(); });
    on('rChan', 'change', function () {

      var def = rlChan(f.chan).def; f.center = def[0]; f.margin = def[1];   /* 채널을 바꾸면 그 채널 기본값(콘과 같음) */
      var devs = rlChanDevices(d, f.chan); f.dev = devs[0] ? devs[0].mac : '';
      renderRelay();
    });
    /* 값 버튼 → 롤러(확인하면 값 반영, 적용 버튼으로 저장) */
    [].forEach.call(document.querySelectorAll('[data-roll]'), function (btn) {

    on('rGc', 'change', function () { f.gc = +this.value; renderRelay(); });

    on('rStat', 'change', function () { f.stat = +this.value; rlDirty(); });

    on('rHold', 'change', function () { f.hold = +this.value; rlDirty(); });
    on('rApply', 'click', function () {
      post('api/relay/apply?idx=' + d.idx, rlForm()).then(function () { rlSnap = rlForm(); rlDirty(); toast(S('STR_BTN_APPLY') + ' \u2713'); })
        .catch(function (e) { if (!(e && e.handled)) toast('Error'); });

  }

  /* ── 오래 걸리는 작업 오버레이: busyStart(라벨) → busySet(0~1 또는 null) → busyEnd(). 0.3초 안에 끝나면 안 보임 ── */
  var busy = null;
  function busyDraw() {
    if (!busy) return;
    var sec = Math.floor((Date.now() - busy.t0) / 1000);
    $('busyTxt').textContent = Wt(busy.label) + (busy.pct !== null ? ' ' + Math.floor(busy.pct * 100) + '%' : '') + ' \u00b7 ' + sec + Wt('SEC');
    $('busyBar').style.display = busy.pct !== null ? '' : 'none';
    $('busyFill').style.width = busy.pct !== null ? (busy.pct * 100) + '%' : '0';
  }
  function busyStart(label) {
    busyEnd();
    busy = { label: label, pct: null, t0: Date.now() };
    busy.show = setTimeout(function () { $('busy').classList.remove('hidden'); busyDraw(); }, 300);
    busy.tick = setInterval(busyDraw, 500);
  }
  function busySet(pct) { if (busy) { busy.pct = pct; busyDraw(); } }
  function busyEnd() {
    if (!busy) return;
    clearTimeout(busy.show); clearInterval(busy.tick);
    busy = null;
    $('busy').classList.add('hidden');
  }

  /* 사진 받기(진행률) — 콘이 Content-Length를 주므로 받은 양으로 %. 받은 사진은 blob URL로 기억(다시 보면 바로) */
  var photoBlobs = {};
  function loadPhoto(url) {
    if (photoBlobs[url]) return Promise.resolve(photoBlobs[url]);
    busyStart('LOADING');
    return fetch(url, { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { show('login'); throw { handled: true }; }
      if (r.status === 409) { show('local'); throw { handled: true }; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var total = +r.headers.get('Content-Length') || 0;
      if (!r.body || !r.body.getReader) return r.blob();
      var reader = r.body.getReader(), chunks = [], got = 0;
      function pump() {
        return reader.read().then(function (x) {
          if (x.done) return new Blob(chunks, { type: 'image/jpeg' });
          chunks.push(x.value); got += x.value.length;
          if (total) busySet(Math.min(1, got / total));
          return pump();
        });
      }
      return pump();
    }).then(function (b) {
      busyEnd();
      return (photoBlobs[url] = URL.createObjectURL(b));
    }, function (e) { busyEnd(); throw e; });
  }

  /* ── 카메라 팝업(콘 build_camera_tab과 같은 기능): 카메라 선택, 지금촬영·목록갱신·모두 지우기, 사진 목록(20장씩), 미리보기,
   *    웹 전용 전체 화면 보기. 미리보기는 원본 JPEG을 브라우저가 줄여서 보여 줌(썸네일 파일 없음 — 사용자 결정) ── */
  var cam = null, camTimer = null;
  function fmtTime(t) { var d = new Date(t * 1000).toISOString(); return d.substr(5, 5) + ' ' + d.substr(11, 8); }   /* 콘 시각은 현지값을 그대로 초로 셈 */
  function photoName(it) { return it.kind + ('00000000' + it.seq).slice(-8); }
  function photoUrl(it) { return 'api/cam/photo?mac=' + cam.mac + '&kind=' + it.kind.charCodeAt(0) + '&seq=' + it.seq; }
  function openCamera() {
    api('api/cam/list').then(function (d) {
      var prev = cam && cam.mac;
      var list = d.cams || [];
      cam = { list: list, mac: (list.some(function (c) { return c.mac === prev; }) ? prev : (list[0] ? list[0].mac : '')),
              page: 0, data: null, sel: null };
      openSheet(renderCamera);
      loadPhotos();
    }).catch(function () {});
  }
  function loadPhotos() {
    if (!cam || !cam.mac) { renderCamera(); return; }
    api('api/cam/photos?mac=' + cam.mac + '&page=' + cam.page).then(function (d) {
      cam.data = d;
      if (cam.sel && !d.items.some(function (it) { return it.kind === cam.sel.kind && it.seq === cam.sel.seq; }) && cam.page === 0) cam.sel = null;
      if (!cam.sel && d.items.length && cam.page === 0) cam.sel = d.items[0];   /* 처음엔 최신 사진 */
      if (sheetRender === renderCamera) renderCamera();
    }).catch(function () {});
  }
  function renderCamera() {
    /* 10-05 — 다시 그릴 때 새 사진을 받는 동안은 이전 사진을 그대로(비워 두면 세로에서 미리보기 높이가 0이 되어 목록이 화면을 채움) */
    var oldImg = $('camPrev'), oldSrc = oldImg ? oldImg.getAttribute('src') : null;
    /* 같은 쪽을 다시 그릴 때(사진 선택 등)는 목록 스크롤 위치를 유지 */
    var oldList = document.querySelector('#sheetBody .plist');
    var keepTop = (oldList && cam.shownPage === cam.page) ? oldList.scrollTop : 0;
    cam.shownPage = cam.page;
    $('sheetBody').className = 'sbody cam';
    var h = sheetHead('STR_GROUP_CAMERA');
    if (!cam.list.length) {
      $('sheetBody').innerHTML = h + '<div class="field"><span class="sub">' + esc(S('STR_PANEL_NO_CAMERA')) + '</span></div>';
      return;
    }
    var cur = cam.list.filter(function (c) { return c.mac === cam.mac; })[0];
    /* 10-05 — 카메라 선택과 버튼을 한 줄에(가로 화면에서 목록 높이 확보). 폭이 모자라면 줄바꿈 */
    h += '<div class="btnrow" style="align-items:center"><select id="camSel">' + cam.list.map(function (c) {
      return '<option value="' + c.mac + '"' + (c.mac === cam.mac ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('') + '</select>' + (cur && cur.status !== 'offline' ? '<span class="sub">' + esc(S(STATUS_KEY[cur.status] || 'STR_STATUS_PAIRED')) + '</span>' : '');
    h += '<button id="camShot" class="primary"' + (cur && cur.status === 'active' ? '' : ' disabled') + '>' + esc(S('STR_BTN_CAPTURE_NOW')) +
         '</button><button id="camRenew">' + esc(S('STR_BTN_RENEW_LIST')) + '</button><button id="camDelAll" class="danger">' + esc(S('STR_BTN_DELETE_ALL')) + '</button></div>';
    h += '<div class="camsplit"><div class="prev">' + (cam.sel ? '<img id="camPrev" alt=""><div class="sub">' + esc(photoName(cam.sel) + '  ' + fmtTime(cam.sel.t)) + '</div>'
                                          : '<span class="sub">' + esc(S('STR_PANEL_NO_PHOTO_YET')) + '</span>') + '</div>';
    var d = cam.data;
    h += '<div class="camlist"><div class="field"><strong>' + esc(S('STR_PANEL_LIST')) + '</strong><span class="sub">' + (d ? d.count : '') + '</span></div>';
    if (d && d.items.length) {
      h += '<div class="plist">' + d.items.map(function (it) {
        var on = cam.sel && cam.sel.kind === it.kind && cam.sel.seq === it.seq;
        return '<div class="prow tap' + (on ? ' sel' : '') + '" data-ph="' + it.kind + it.seq + '"><span class="grow">' + esc(photoName(it) + '  ' + fmtTime(it.t) +
               ' (' + Math.round(it.size / 1024) + 'KB)') + '</span><button class="small danger" data-del="' + it.kind + it.seq + '">&#x1F5D1;</button></div>';
      }).join('') + '</div>';
      var pages = Math.max(1, Math.ceil(d.count / d.page_size));
      h += '<div class="pager"><button class="small" data-pg="-10">' + esc(S('STR_BTN_JUMP_PREV10')) + '</button><button class="small" data-pg="-1">&lt;</button>' +
           '<span class="sub">' + (cam.page + 1) + ' / ' + pages + '</span><button class="small" data-pg="1">&gt;</button><button class="small" data-pg="10">' +
           esc(S('STR_BTN_JUMP_NEXT10')) + '</button></div>';
    } else if (d) {
      h += '<div class="field"><span class="sub">' + esc(S('STR_LIST_EMPTY')) + '</span></div>';
    }
    h += '</div></div>';   /* .camlist, .camsplit */
    $('sheetBody').innerHTML = h;
    var newList = document.querySelector('#sheetBody .plist');
    if (newList) newList.scrollTop = keepTop;
    bindCamera();
    if (cam.sel) {
      var want = photoUrl(cam.sel);
      if ($('camPrev')) $('camPrev').src = photoBlobs[want] || oldSrc || '';
      loadPhoto(want).then(function (src) {
        var img = $('camPrev');
        if (img && cam.sel && photoUrl(cam.sel) === want) img.src = src;
      }).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
    }
  }
  function findItem(code) { return (cam.data ? cam.data.items : []).filter(function (it) { return it.kind + it.seq === code; })[0]; }
  function bindCamera() {
    function on(id, fn) { var el = $(id); if (el) el.addEventListener(id === 'camSel' ? 'change' : 'click', fn); }
    on('camSel', function () { cam.mac = this.value; cam.page = 0; cam.sel = null; cam.data = null; renderCamera(); loadPhotos(); });
    on('camRenew', function () { loadPhotos(); });
    on('camShot', function () {
      var before = cam.data ? cam.data.count : 0;
      post('api/cam/capture?mac=' + cam.mac).then(function () {
        /* 사진은 캠이 콘으로 바로 보냄 — 경과 시간을 띄우고 3초마다 목록 수를 확인, 늘면 닫고 새 사진을 보여 줌(30초 넘으면 알림) */
        busyStart('CAPTURING');
        var t0 = Date.now(); clearInterval(camTimer);
        camTimer = setInterval(function () {
          if (sheetRender !== renderCamera) { clearInterval(camTimer); busyEnd(); return; }
          api('api/cam/photos?mac=' + cam.mac + '&page=0').then(function (d) {
            if (d.count > before) { clearInterval(camTimer); busyEnd(); cam.page = 0; cam.sel = null; cam.data = d; loadPhotos(); }
            else if (Date.now() - t0 > 30000) { clearInterval(camTimer); busyEnd(); toast(Wt('NO_PHOTO')); }
          }).catch(function () {});
        }, 3000);
      }).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
    });
    on('camDelAll', function () {
      if (!confirm(S('STR_MSG_DELETE_ALL_CONFIRM'))) return;
      post('api/cam/delete_all?mac=' + cam.mac).then(function () { cam.page = 0; cam.sel = null; loadPhotos(); })
        .catch(function (e) { if (!(e && e.handled)) toast('Error'); });
    });
    on('camPrev', function () { var u = photoUrl(cam.sel); loadPhoto(u).then(openViewer).catch(function () {}); });
    $('sheetBody').querySelectorAll('[data-ph]').forEach(function (row) {
      row.addEventListener('click', function (ev) {
        var del = ev.target.closest('[data-del]');
        var it = findItem((del || row).getAttribute(del ? 'data-del' : 'data-ph'));
        if (!it) return;
        if (del) {
          if (!confirm(S('STR_MSG_DELETE_PHOTO_CONFIRM'))) return;
          post('api/cam/delete?mac=' + cam.mac + '&kind=' + it.kind.charCodeAt(0) + '&seq=' + it.seq).then(function () {
            if (cam.sel && cam.sel.seq === it.seq && cam.sel.kind === it.kind) cam.sel = null;
            loadPhotos();
          }).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
          return;
        }
        cam.sel = it;
        renderCamera();
      });
    });
    $('sheetBody').querySelectorAll('[data-pg]').forEach(function (b) {
      b.addEventListener('click', function () {
        var pages = Math.max(1, Math.ceil(cam.data.count / cam.data.page_size));
        cam.page = Math.min(pages - 1, Math.max(0, cam.page + (+b.getAttribute('data-pg'))));
        loadPhotos();
      });
    });
  }

  /* ── 에러·경고 목록(콘 cb_logo_warning_tap): 에러 Exxxx(빨강), 경고 Wxxxx(짙은 노랑), 행마다 지우기. SD 5008/5009는 지우기 대신
   *    해결 → 재마운트/포맷(콘처럼 검증을 통과해야 지워짐). X로만 닫힘 ── */
  var errs = null;
  function openErrors() {
    api('api/errors').then(function (d) { errs = d; openSheet(renderErrors); }).catch(function () {});
  }
  function reloadErrors() {
    api('api/errors').then(function (d) { errs = d; if (sheetRender === renderErrors) renderErrors(); poll(); }).catch(function () {});
  }
  function errDesc(kind, code) { var k = ERRDESC[kind][code] || ERRDESC[kind + '_UNKNOWN']; return k ? S(k) : ''; }
  function renderErrors() {
    var h = sheetHead('STR_TITLE_ERROR_LIST');
    if (!errs.errors.length && !errs.warns.length) h += '<div class="field"><span class="sub">' + esc(S('STR_ERROR_LIST_EMPTY')) + '</span></div>';
    errs.errors.forEach(function (c) {
      var sd = c === 5008 || c === 5009;
      h += '<div class="field"><label style="color:var(--red)">' + esc('E' + ('000' + c).slice(-4) + ' ' + errDesc('E', c)) + '</label>' +
           (sd ? '<button class="small" data-sdres="1">' + esc(S('STR_BTN_SD_RESOLVE')) + '</button>'
               : '<button class="small" data-eclr="e' + c + '">' + esc(S('STR_BTN_DISMISS')) + '</button>') + '</div>';
    });
    errs.warns.forEach(function (c) {
      h += '<div class="field"><label style="color:#b8860b">' + esc('W' + ('000' + c).slice(-4) + ' ' + errDesc('W', c)) + '</label>' +
           '<button class="small" data-eclr="w' + c + '">' + esc(S('STR_BTN_DISMISS')) + '</button></div>';
    });
    $('sheetBody').innerHTML = h;
    $('sheetBody').querySelectorAll('[data-eclr]').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-eclr');
        post('api/errors/clear?kind=' + v.charAt(0) + '&code=' + v.slice(1)).then(reloadErrors).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
      });
    });
    $('sheetBody').querySelectorAll('[data-sdres]').forEach(function (b) { b.addEventListener('click', openSdResolve); });
  }
  /* SD 해결 — 재마운트 / 포맷(확인). 결과는 콘과 같은 문구. 실패하면 이 선택창을 다시 띄움(콘: 해결 팝업이 남아 다른 조치를 고름) */
  function openSdResolve() {
    $('modalBox').innerHTML = '<div class="mtitle">' + esc(S('STR_TITLE_SD_RESOLVE')) + '</div>' +
      '<div class="sfoot"><button data-m="no">' + esc(S('STR_BTN_CANCEL')) + '</button><button data-m="rec">' + esc(S('STR_BTN_SD_RECONNECT')) +
      '</button><button class="danger" data-m="fmt">' + esc(S('STR_BTN_SD_FORMAT')) + '</button></div>';
    $('modal').classList.remove('hidden');
    $('modal').onclick = function (ev) {
      var m = ev.target.closest('[data-m]');
      if (!m) return;
      var a = m.getAttribute('data-m');
      $('modal').classList.add('hidden');
      $('modal').onclick = null;
      if (a === 'no') return;
      if (a === 'fmt' && !confirm(S('STR_MSG_SD_FORMAT_CONFIRM'))) { openSdResolve(); return; }
      busyStart('LOADING');
      post(a === 'rec' ? 'api/sd/reconnect' : 'api/sd/format').then(function () {
        busyEnd();
        alert(S(a === 'rec' ? 'STR_MSG_SD_RECONNECT_OK' : 'STR_MSG_SD_FORMAT_OK'));
        reloadErrors();
      }).catch(function (e) {
        busyEnd();
        if (e && e.handled) return;
        alert(S(a === 'rec' ? 'STR_MSG_SD_RECONNECT_FAIL' : 'STR_MSG_SD_FORMAT_FAIL'));
        openSdResolve();
      });
    };
  }

  /* ── 알림(할 일 AD 5단계): 콘 알림 기록이 기준. 안 본 개수 = 콘 마지막 번호 - 이 브라우저가 본 번호(브라우저마다 따로).
   *    웹앱이 열려 있는 동안 생긴 보낼 대상은 콘이 주화면 내용(alarm.new)에 실어 줌 → 토스트 ── */
  var ALARM_MAX = 500, alarmSeen = null, alarmLast = 0, shownMax = 0;
  try { var sv = localStorage.getItem('alarmSeen'); if (sv !== null && sv !== '') alarmSeen = +sv; } catch (e) {}
  function setAlarmSeen(v) { alarmSeen = v; try { localStorage.setItem('alarmSeen', String(v)); } catch (e) {} }
  function typeLabel(t) { var x = W.N_TYPES[t]; return x ? x[li()] : ''; }
  function renderAlarmBadge() {
    var n = Math.max(0, Math.min(ALARM_MAX, alarmLast - (alarmSeen || 0))), el = $('alarmCnt');
    el.textContent = n > 99 ? '99+' : String(n);
    el.classList.toggle('hidden', n === 0);
  }
  function checkAlarms(a) {
    if (!a) return;
    /* 처음 쓰는 브라우저는 지난 알림을 안 본 것으로 치지 않음. 콘 기록이 비워졌으면(번호가 줄면) 다시 맞춤 */
    if (alarmSeen === null || a.last < alarmSeen) setAlarmSeen(a.last);
    alarmLast = a.last;
    renderAlarmBadge();
    var fresh = (a.new || []).filter(function (it) { return it.id > shownMax; });
    if (fresh.length) {
      var it = fresh[fresh.length - 1];
      toast(typeLabel(it.type) + ' \u00b7 ' + it.msg + (fresh.length > 1 ? ' (+' + (fresh.length - 1) + ')' : ''), true);   /* 10-05 — 배너 대신 토스트(사용자 지시), 기록은 종 버튼 */
      shownMax = it.id;
      post('api/alarms/ack?id=' + shownMax).catch(function () {});
    }
  }

  var al = { page: 0, data: null, seenAtOpen: 0 };
  function openAlarms() {
    al.page = 0;
    al.data = null;
    al.seenAtOpen = alarmSeen || 0;   /* 이 팝업 안에서는 열기 전 기준으로 안 본 것을 굵게 */
    openSheet(renderAlarms);
    loadAlarms();
  }
  function loadAlarms() {
    api('api/alarms?page=' + al.page).then(function (d) {
      al.data = d;
      if (al.page === 0) { setAlarmSeen(d.last); alarmLast = d.last; renderAlarmBadge(); }   /* 열어 본 것 = 모두 본 것 */
      if (sheetRender === renderAlarms) renderAlarms();
    }).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
  }
  function renderAlarms() {
    var h = sheetHead('STR_TAB_OPTION').replace(esc(S('STR_TAB_OPTION')), esc(Wt('NOTIFY')));
    var d = al.data;
    if (d) {
      if (!d.items.length) h += '<div class="field"><span class="sub">' + esc(Wt('NO_ALARMS')) + '</span></div>';
      h += d.items.map(function (it) {
        return '<div class="arow' + (it.id > al.seenAtOpen ? ' unread' : '') + '"><div class="sub">' + esc(fmtTime(it.t) + '  ' + typeLabel(it.type) +

  /* ── 설정 팝업(콘 build_option_tab과 같은 항목 — 언어·네트워크·화면 끄기는 뺌(사용자 결정)) + 웹 전용 알림·보안.
   *    선택지는 고르는 즉시 저장(콘과 같음), 글자 입력(토픽·주소·비밀번호)만 버튼으로 ── */
  var cfg = null, setTimer = null, logTimer = null, clockOff = 0;
  function fmtFull(t) { var d = new Date(t * 1000).toISOString(); return d.substr(0, 10) + ' ' + d.substr(11, 8); }   /* 콘 시각 = 현지값을 초로 */

    var RESP_HELP = ['STR_RESPONSE_HELP_0', 'STR_RESPONSE_HELP_1', 'STR_RESPONSE_HELP_2', 'STR_RESPONSE_HELP_3', 'STR_RESPONSE_HELP_4'];   /* 콘 update_response_help_text */

               esc(S('STR_BTN_SET_TIME')) + '</button><button id="stTimePhone" class="small">' + esc(Wt('TIME_PHONE')) + '</button>');
    h += field(S('STR_TAB_LOG'), '<button id="stLog" class="small">' + esc(S('STR_BTN_VIEW')) + '</button>');
    /* 웹 묶음 — 콘 화면에 없는 웹 전용(언어는 이 브라우저에만 저장) */

    h += gsub(Wt('NOTIFY'));

    h += '<div class="field"><label>' + esc(Wt('CLICK')) + '</label><input type="text" id="stClick" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="159" value="' + esc(n.click) + '"></div>';
    h += '<div class="sfoot"><button id="stNtTest">' + esc(Wt('TEST_SEND')) + '</button><button id="stNtApply" class="primary">' + esc(S('STR_BTN_APPLY')) + '</button></div>';
    h += gsub(Wt('SECURITY'));
    h += '<div class="field"><label>' + esc(Wt('PW_OLD')) + '</label><input type="password" id="stPwOld" autocomplete="current-password"></div>';
    h += '<div class="field"><label>' + esc(Wt('PW_NEW')) + '</label><input type="password" id="stPwNew" autocomplete="new-password"></div>';
    h += '<div class="sfoot"><button id="stPwBtn" class="primary">' + esc(Wt('PW_CHANGE')) + '</button></div>';

  function setKeyVal(key, val) {

  }
  function notifyTypes() {
    var t = 0;

  }
  function saveNotify(topic, click, types) {
    return post('api/notify/set', topic + '\n' + click + '\n' + types).then(function () {
      cfg.notify = { topic: topic, click: click, types: types };
    });
  }
  function bindSettings() {
    function on(id, ev, fn) { var el = $(id); if (el) el.addEventListener(ev, fn); }
    on('stAutoNew', 'change', function () {
      var v = this.checked;
      setKeyVal('auto_new', v ? 1 : 0).then(function () { cfg.auto_new = v; renderSettings(); }).catch(function () { renderSettings(); });
    });
    on('stAutoKnown', 'change', function () {
      var v = this.checked;
      setKeyVal('auto_known', v ? 1 : 0).then(function () { cfg.auto_known = v; }).catch(function () { renderSettings(); });
    });
    on('stRestart', 'click', function () {
      if (!confirm(S('STR_MSG_RESTART_CONFIRM'))) return;
      post('api/restart').then(function () { closeSheet(); toast(Wt('RESTARTING')); }).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
    });
    on('stResp', 'change', function () {
      var v = +this.value;
      setKeyVal('resp', v).then(function () { cfg.resp = v; renderSettings(); }).catch(function () { renderSettings(); });
    });
    on('stAdapt', 'change', function () {
      var v = +this.value;
      setKeyVal('adapt', v).then(function () { cfg.adapt = v; }).catch(function () { renderSettings(); });
    });
    on('stTime', 'click', openTimeRoller);
    on('stTimePhone', 'click', function () {
      var t = new Date();   /* 휴대폰의 현지 시각을 그대로(콘은 현지 시각) */
      sendTime(t.getFullYear(), t.getMonth() + 1, t.getDate(), t.getHours(), t.getMinutes(), t.getSeconds());
    });
    on('stLog', 'click', openLogs);
    $('sheetBody').querySelectorAll('[data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { if (b.getAttribute('data-lang') !== lang) setLang(b.getAttribute('data-lang')); });
    });
    $('sheetBody').querySelectorAll('[data-nt]').forEach(function (el) {
      el.addEventListener('change', function () {
        saveNotify(cfg.notify.topic, cfg.notify.click, notifyTypes()).catch(function (e) { if (!(e && e.handled)) toast('Error'); renderSettings(); });
      });
    });
    on('stNtApply', 'click', function () {
      saveNotify($('stTopic').value.trim(), $('stClick').value.trim(), notifyTypes()).then(function () { toast(Wt('SAVED')); })
        .catch(function (e) { if (!(e && e.handled)) toast(Wt('INVALID')); });
    });
    on('stNtTest', 'click', function () {
      post('api/notify/test').then(function () { toast(Wt('SENT')); }).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
    });
    on('stPwBtn', 'click', function () {
      var o = $('stPwOld').value, nw = $('stPwNew').value;
      if (!o || !nw) return;
      post('api/password', o + '\n' + nw).then(function () { $('stPwOld').value = ''; $('stPwNew').value = ''; toast(Wt('PW_CHANGED')); })
        .catch(function (e) { if (!(e && e.handled)) toast(Wt('PW_FAIL')); });
    });
    on('stLogoutAll', 'click', function () {
      if (!confirm(Wt('LOGOUT_ALL_CONFIRM'))) return;
      post('api/logout_all').then(function () { realCloseSheet(); show('login'); }).catch(function () {});
    });
  }
  function pad2(v) { return (v < 10 ? '0' : '') + v; }
  function sendTime(y, mo, d, hh, mi, ss) {
    var t = y + '-' + pad2(mo) + '-' + pad2(d) + '+' + pad2(hh) + ':' + pad2(mi) + ':' + pad2(ss);
    post('api/time?t=' + t).then(function () {
      clockOff = Date.UTC(y, mo - 1, d, hh, mi, ss) / 1000 - Date.now() / 1000;
      var c = $('stClock'); if (c) c.textContent = fmtFull(Math.floor(Date.now() / 1000 + clockOff));
      toast(Wt('SAVED'));
    }).catch(function (e) { if (!(e && e.handled)) toast('Error'); });
  }
  /* 시각 설정 — 콘 show_settime_popup과 같은 칸(년·월·일·시·분, 연도는 올해 -2 ~ +8), 고르는 건 롤러 */
  function openTimeRoller() {
    var now = new Date(Date.now() + clockOff * 1000), y = now.getUTCFullYear();
    var cols = [['tY', rollCol('tY', y - 2, y + 8, y)], ['tMo', rollCol('tMo', 1, 12, now.getUTCMonth() + 1)], ['tD', rollCol('tD', 1, 31, now.getUTCDate())],
                ['tH', rollCol('tH', 0, 23, now.getUTCHours())], ['tMi', rollCol('tMi', 0, 59, now.getUTCMinutes())]];
    var sep = ['-', '-', '&nbsp;', ':', ''];
    var h = cols.map(function (c, i) { return c[1].html + (sep[i] ? '<span class="rfix">' + sep[i] + '</span>' : ''); }).join('');
    $('modalBox').innerHTML = '<div class="mtitle" style="background:var(--blue);color:#fff">' + esc(S('STR_LABEL_TIME')) + '</div>' +
      '<div class="roll"><div class="band"></div>' + h + '</div>' +
      '<div class="sfoot"><button data-m="no">' + esc(S('STR_BTN_CANCEL')) + '</button><button class="primary" data-m="yes">' + esc(S('STR_BTN_CONFIRM')) + '</button></div>';
    $('modal').classList.remove('hidden');
    cols.forEach(function (c) {
      var el = $(c[0]);
      el.style.width = c[0] === 'tY' ? '72px' : '48px';
      el.scrollTop = (c[1].cur - c[1].a) * ROW;
      markCol(c[0]);
      el.addEventListener('scroll', function () { markCol(c[0]); }, { passive: true });
    });
    $('modal').onclick = function (ev) {
      var m = ev.target.closest('[data-m]');
      if (!m) return;
      if (m.getAttribute('data-m') === 'yes') {
        var v = cols.map(function (c) { return colValue(c[0], c[1].a); });
        var dim = new Date(Date.UTC(v[0], v[1], 0)).getUTCDate();   /* 그달의 마지막 날을 넘지 않게 */
        sendTime(v[0], v[1], Math.min(v[2], dim), v[3], v[4], 0);
      }
      $('modal').classList.add('hidden');
      $('modal').onclick = null;
    };
  }

  /* ── 로그 팝업(콘 build_log_tab): 일반 로그 + Dev Log(일시멈춤, 저장 문턱, 레벨 보기, 태그). 닫으면 설정으로(콘과 같음) ── */
  var logPaused = false;
  function openLogs() {
    logPaused = false;
    openSheet(renderLogs);
    clearInterval(setTimer);
    loadLogs(true);
    clearInterval(logTimer);
    logTimer = setInterval(function () { if (sheetRender === renderLogs) loadLogs(false); }, 2000);
  }
  function renderLogs() {
    var dv = cfg.dev, names = ['', 'E', 'W', 'I', 'D'];
    var h = '<div class="shead"><h3>' + esc(S('STR_TAB_LOG')) + '</h3><button class="xbtn" id="logBack" aria-label="close">&#x2715;</button></div>';
    h += gtitle(S('STR_PANEL_GENERAL_LOG')) + '<div class="logbox" id="logGen" style="margin-top:8px"></div>';
    h += '<div class="gtitle" style="display:flex;justify-content:space-between;align-items:center"><span>' + esc(S('STR_PANEL_DEV_LOG')) +
         '</span><button class="small" id="logPause">' + esc(S(logPaused ? 'STR_BTN_RESUME' : 'STR_BTN_PAUSE')) + '</button></div>';
    h += '<div class="btnrow" style="align-items:center;border-bottom:none">Save <select id="devSave">' + [1, 2, 3, 4].map(function (l) {
      return '<option value="' + l + '"' + (l === dv.save ? ' selected' : '') + '>' + names[l] + '</option>';
